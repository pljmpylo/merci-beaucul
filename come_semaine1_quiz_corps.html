<head>

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    --blue: #2F6FE4;
    --blue-soft: rgba(47,111,228,0.18);
    --blue-faint: rgba(47,111,228,0.06);
    --yellow: #F7FF59;
    --ink: #1c1c1c;
    --muted: #5b6273;
    font-family: 'Raleway', Arial, sans-serif;
    color: var(--ink);
    background: #fff;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  a, button { cursor: pointer; font-family: inherit; }
  :focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
  .qt-wrap { min-height: 100vh; }
  .qt-shell { max-width: 660px; margin: 0 auto; padding: 56px 24px 90px; }

  /* ---------- shared ---------- */
  .qt-hidden { display: none !important; }
  .qt-eyebrow {
    display: inline-block;
    color: var(--blue);
    border: 1px solid var(--blue-soft);
    border-radius: 999px;
    padding: 5px 14px;
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 24px;
  }

  /* ---------- CTA façon Mimétique ---------- */
  .qt-btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    overflow: hidden;
    background: var(--yellow);
    color: var(--blue);
    font-weight: 700;
    font-size: 0.95rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    white-space: nowrap;
    padding: 0.85rem 2.2rem;
    border: 1.5px solid var(--blue);
    border-radius: 10rem;
    transition: color 450ms ease;
    -webkit-tap-highlight-color: transparent;
  }
  .qt-btn::before {
    content: '';
    position: absolute;
    left: 0; right: 0; bottom: 0;
    top: 102%;
    background: var(--blue);
    transition: top 450ms ease;
    z-index: 0;
  }
  .qt-btn span { position: relative; z-index: 1; }
  .qt-btn .qt-arrow { display: inline-block; transition: transform 450ms ease; }
  .qt-btn:hover { color: var(--yellow); }
  .qt-btn:hover::before { top: 0; }
  .qt-btn:hover .qt-arrow { transform: translateX(5px); }
  .qt-btn:disabled { opacity: 0.4; pointer-events: none; }

  .qt-btn-outline { background: #fff; color: var(--blue); }
  .qt-btn-outline::before { background: var(--blue); }
  .qt-btn-outline:hover { color: var(--yellow); }

  @media (prefers-reduced-motion: reduce) {
    .qt-btn, .qt-btn::before, .qt-btn .qt-arrow, .qt-progress-bar { transition: none; }
    .qt-screen { animation: none; }
  }

  /* ---------- intro ---------- */
  .qt-screen { animation: qtFadeUp 0.45s ease both; }
  @keyframes qtFadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  #qt-intro h1 {
    font-size: clamp(34px, 6vw, 50px);
    font-weight: 800;
    line-height: 1.05;
    letter-spacing: -0.015em;
    margin-bottom: 24px;
  }
  #qt-intro h1 em {
    font-style: normal;
    color: var(--blue);
    background: linear-gradient(transparent 62%, var(--yellow) 62%);
    padding: 0 4px;
  }
  .qt-intro-text {
    font-size: 16.5px;
    color: var(--muted);
    max-width: 480px;
    margin-bottom: 14px;
  }
  #qt-intro .qt-btn { margin-top: 30px; }

  /* ---------- quiz ---------- */
  .qt-progress-label {
    font-size: 12px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--blue);
    margin-bottom: 10px;
    text-align: right;
  }
  .qt-progress-track {
    height: 8px;
    background: #fff;
    border: 1.5px solid var(--blue);
    border-radius: 99px;
    overflow: hidden;
    margin-bottom: 42px;
  }
  .qt-progress-bar {
    height: 100%;
    background: var(--yellow);
    border-right: 1.5px solid var(--blue);
    transition: width 350ms ease;
    width: 0%;
  }
  .qt-q-text {
    font-weight: 700;
    font-size: clamp(21px, 3.2vw, 26px);
    line-height: 1.3;
    color: var(--ink);
    margin-bottom: 30px;
  }
  .qt-options { display: flex; flex-direction: column; gap: 12px; }
  .qt-opt-btn {
    display: flex;
    align-items: center;
    gap: 16px;
    text-align: left;
    background: #fff;
    border: 1.5px solid var(--blue-soft);
    border-radius: 18px;
    padding: 16px 20px;
    font-size: 15.5px;
    line-height: 1.5;
    color: var(--ink);
    transition: border-color 180ms ease, background 180ms ease, box-shadow 180ms ease;
  }
  .qt-opt-btn:hover:not(:disabled) {
    border-color: var(--blue);
    box-shadow: 0 0 0 4px var(--blue-faint);
  }
  .qt-opt-btn.qt-selected {
    border-color: var(--blue);
    background: var(--yellow);
    box-shadow: 0 0 0 4px var(--blue-faint);
  }
  .qt-opt-letter {
    flex: 0 0 30px;
    width: 30px; height: 30px;
    border-radius: 50%;
    border: 1.5px solid var(--blue);
    background: #fff;
    color: var(--blue);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700;
    line-height: 1;
  }
  .qt-selected .qt-opt-letter { background: var(--blue); color: var(--yellow); }
  .qt-opt-text { flex: 1; }

  /* ---------- results ---------- */
  .qt-result-kicker {
    font-size: 12px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--blue);
    margin-bottom: 12px;
  }
  .qt-result-title {
    font-weight: 800;
    font-size: clamp(26px, 4.4vw, 34px);
    color: var(--ink);
    line-height: 1.18;
    margin-bottom: 20px;
  }
  .qt-result-title strong {
    font-weight: 800;
    color: var(--blue);
    background: linear-gradient(transparent 62%, var(--yellow) 62%);
  }
  .qt-result-desc {
    font-size: 16px;
    color: var(--muted);
    margin-bottom: 12px;
  }
  .qt-divider {
    border: none;
    border-top: 1.5px solid var(--blue-soft);
    margin: 38px 0;
  }
  .qt-ex-label {
    display: inline-block;
    background: var(--yellow);
    border: 1.5px solid var(--blue);
    color: var(--blue);
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    padding: 5px 15px;
    border-radius: 100px;
    margin: 6px 0 14px;
  }
  .qt-ex-intro {
    font-size: 15.5px;
    color: var(--ink);
    margin-bottom: 20px;
  }
  .qt-ex-intro u { text-decoration-color: var(--blue); text-decoration-thickness: 2px; text-underline-offset: 3px; }

  /* cartes à remplir : blanc + halo bleu */
  .qt-card, .qt-callout {
    background: #fff;
    border: 1.5px solid var(--blue);
    border-radius: 22px;
    padding: 22px 22px 24px;
    margin-bottom: 18px;
    box-shadow: 0 0 0 6px var(--blue-faint), 0 10px 28px rgba(47,111,228,0.12);
  }
  .qt-card-name, .qt-callout-label {
    font-weight: 800;
    font-size: 15px;
    color: var(--blue);
    margin-bottom: 16px;
  }
  .qt-field { margin-bottom: 16px; }
  .qt-field:last-child { margin-bottom: 0; }
  .qt-field-label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .qt-input, .qt-textarea {
    width: 100%;
    border: none;
    border-bottom: 1.5px solid var(--blue-soft);
    background: transparent;
    font-family: 'Raleway', sans-serif;
    font-size: 14.5px;
    color: var(--ink);
    padding: 6px 2px;
    transition: border-color 180ms ease;
  }
  .qt-input::placeholder, .qt-textarea::placeholder { color: #9aa1b0; }
  .qt-input:focus, .qt-textarea:focus { outline: none; border-color: var(--blue); }
  .qt-textarea {
    resize: vertical; min-height: 48px;
    border: 1.5px solid var(--blue-soft);
    border-radius: 12px;
    padding: 10px 12px;
  }
  .qt-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .qt-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }

  .qt-chip-group { display: flex; flex-wrap: wrap; gap: 8px; }
  .qt-chip {
    display: inline-flex; align-items: center; justify-content: center;
    background: #fff;
    border: 1.5px solid var(--blue-soft);
    border-radius: 100px;
    padding: 7px 15px;
    font-size: 13px;
    font-weight: 600;
    line-height: 1.3;
    color: var(--ink);
    transition: border-color 150ms ease, background 150ms ease, color 150ms ease;
  }
  .qt-chip:hover { border-color: var(--blue); color: var(--blue); }
  .qt-chip.qt-chip-active { background: var(--yellow); border-color: var(--blue); color: var(--blue); }
  .qt-chip-other-input { margin-top: 10px; }

  .qt-callout-example {
    font-style: italic;
    font-size: 13px;
    color: var(--muted);
    margin-top: 12px;
  }

  .qt-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 30px; }

  /* bloc impression */
  .qt-print-box {
    border-top: 1.5px solid var(--blue-soft);
    padding-top: 34px;
    margin-top: 40px;
    text-align: center;
  }
  .qt-print-title { font-weight: 800; font-size: 17px; color: var(--ink); margin-bottom: 6px; }
  .qt-print-text { font-size: 14px; color: var(--muted); max-width: 400px; margin: 0 auto 20px; }

  @media (max-width: 520px) {
    .qt-shell { padding: 40px 18px 70px; }
    .qt-row-2, .qt-row-3 { grid-template-columns: 1fr; }
    .qt-card, .qt-callout { padding: 18px 16px 20px; }
    .qt-btn { white-space: normal; text-align: center; padding: 0.85rem 1.6rem; }
  }

  @media print {
    #qt-intro, #qt-quiz, .qt-print-box, .qt-actions { display: none !important; }
    #qt-results { display: block !important; }
    .qt-card, .qt-callout { box-shadow: none; break-inside: avoid; page-break-inside: avoid; }
  }
</style>
</head>
<body>

  var currentQ = 0;
  var score = 0;
  var answering = false;

  var elIntro = document.getElementById('qt-intro');
  var elQuiz = document.getElementById('qt-quiz');
  var elResults = document.getElementById('qt-results');

  document.getElementById('qt-start-btn').addEventListener('click', startQuiz);

  function startQuiz() {
    elIntro.classList.add('qt-hidden');
    elQuiz.classList.remove('qt-hidden');
    renderQuestion();
  }

  function renderQuestion() {
    var q = QUESTIONS[currentQ];
    var total = QUESTIONS.length;
    answering = false;
    document.getElementById('qt-progress-label').textContent = 'Question ' + (currentQ + 1) + ' / ' + total;
    document.getElementById('qt-progress-bar').style.width = (((currentQ + 1) / total) * 100) + '%';
    var container = document.getElementById('qt-q-container');
    var letters = ['A', 'B', 'C', 'D'];
    var html = '';
    html += '<p class="qt-q-text">' + q.text + '</p>';
    html += '<div class="qt-options">';
    q.opts.forEach(function (opt, i) {
      html += '<button class="qt-opt-btn" data-points="' + opt.p + '">'
        + '<span class="qt-opt-letter">' + letters[i] + '</span>'
        + '<span class="qt-opt-text">' + opt.t + '</span>'
        + '</button>';
    });
    html += '</div>';
    container.innerHTML = html;
    container.addEventListener('click', onOptionClick);
  }

  function onOptionClick(e) {
    var btn = e.target.closest('.qt-opt-btn');
    if (!btn || answering) return;
    answering = true;
    var container = document.getElementById('qt-q-container');
    container.removeEventListener('click', onOptionClick);
    container.querySelectorAll('.qt-opt-btn').forEach(function (b) { b.disabled = true; });
    btn.classList.add('qt-selected');
    score += parseInt(btn.dataset.points, 10);
    setTimeout(function () {
      currentQ++;
      if (currentQ < QUESTIONS.length) {
        renderQuestion();
      } else {
        showResults();
      }
    }, 350);
  }

  function getBand() {
    if (score <= 7) return 'a';
    if (score <= 11) return 'b';
    return 'c';

  function chipGroup(name, options) {
    var html = '<div class="qt-chip-group" data-chip-group="' + name + '">';
    options.forEach(function (o) {
      html += '<button type="button" class="qt-chip" data-value="' + o + '">' + o + '</button>';

    html += '</div><input type="text" class="qt-input qt-chip-other-input qt-hidden" placeholder="précise ici…" data-chip-other="' + name + '">';
    return html;

  function cycleStressPointer() {
    var html = '<div class="qt-ex-label">Exercice 1</div>';
    html += '<p class="qt-ex-intro">Remplis le tableau « Cycle du stress » : note, pour 1 ou 2 situations (masturbation, pénétration, sexe oral…), les émotions et sensations qui apparaissent, même si c\'est un peu flou.</p>';
    return html;
  }

  function observerChecklist() {
    return '<div class="qt-callout">'
      + '<div class="qt-callout-label">Ce que tu peux observer :</div>'
      + '<div class="qt-field"><span class="qt-field-label">Respiration</span>' + chipGroup('a2-obs-respiration', ['Rapide', 'Bloquée', 'Profonde', 'Irrégulière', 'Calme']) + '</div>'
      + '<div class="qt-field"><span class="qt-field-label">Muscles</span>' + chipGroup('a2-obs-muscles', ['Épaules serrées', 'Mâchoire contractée', 'Ventre tendu', 'Cuisses raides', 'Bassin mobile']) + '</div>'
      + '<div class="qt-field"><span class="qt-field-label">Périnée</span>' + chipGroup('a2-obs-perinee', ['Détendu', 'Serré', 'Qui pulse', 'Difficile à sentir']) + '</div>'
      + '<div class="qt-field"><span class="qt-field-label">Excitation</span>' + chipGroup('a2-obs-excitation', ['Monte doucement', 'Monte d\'un coup', 'Reste stable', 'Redescend', 'Varie']) + '</div>'
      + '<p class="qt-callout-example">Mes pensées, par exemple : « il faut que je finisse », « ça va trop vite », « j\'aime bien », « je m\'ennuie », « je peux prendre mon temps »…</p>'
      + '</div>';
  }

  function showResults() {
    elQuiz.classList.add('qt-hidden');
    elResults.classList.remove('qt-hidden');
    var band = getBand();
    var container = document.getElementById('qt-results-container');
    var html = '';

    html += '<div class="qt-result-kicker">Ton résultat</div>';

    if (band === 'a') {
      html += '<h2 class="qt-result-title">Ton rapport au corps : <strong>« Je suis surtout dans ma tête »</strong></h2>';
      html += '<p class="qt-result-desc">Tu vis beaucoup ta sexualité dans le mental : images, scénarios, performance, et ton corps reste un peu en arrière-plan.</p>';
      html += '<p class="qt-result-desc">Du coup, les signaux d\'excitation (pulsations, périnée, respiration, rythme cardiaque) sont peu repérés, ce qui rend plus difficile d\'anticiper et de jouer avec l\'éjaculation.</p>';
      html += '<hr class="qt-divider">';

      html += cycleStressPointer();

      html += '<div class="qt-ex-label">Exercice 2</div>';
      html += '<p class="qt-ex-intro">Explore la masturbation sans but d\'éjaculation, juste pour t\'entraîner à rester avec les sensations sans viser le climax.</p>';
      html += observerChecklist();

      html += '<div class="qt-callout">'

        + '<div class="qt-row-3">'
        + '<div class="qt-field"><span class="qt-field-label">Sensation 1</span><input type="text" class="qt-input"></div>'
        + '<div class="qt-field"><span class="qt-field-label">Sensation 2</span><input type="text" class="qt-input"></div>'
        + '<div class="qt-field"><span class="qt-field-label">Sensation 3</span><input type="text" class="qt-input"></div>'
        + '</div>'
        + '</div>';
    }

    if (band === 'b') {
      html += '<h2 class="qt-result-title">Ton rapport au corps : <strong>« Entre deux »</strong></h2>';
      html += '<p class="qt-result-desc">T\'as déjà accès à certaines sensations, tu remarques parfois les signaux d\'excitation, mais c\'est pas vraiment un réflexe de t\'y connecter.</p>';

      html += '<hr class="qt-divider">';

        { name: 'Pression / geste', habit: 'Même main, même pression, même mouvement', test: ['Pression plus douce', 'Pression plus ferme', 'Caresses', 'Massage', 'Main non dominante'], observe: ['Zones agréables', 'Zones neutres', 'Zones trop intenses'] },

  function onResultsClick(e) {
    var chip = e.target.closest('.qt-chip');
    if (!chip) return;
    var group = chip.closest('.qt-chip-group');
    var groupName = group.dataset.chipGroup;
    var wasActive = chip.classList.contains('qt-chip-active');
    group.querySelectorAll('.qt-chip').forEach(function (c) { c.classList.remove('qt-chip-active'); });
    var otherInput = group.parentNode.querySelector('[data-chip-other="' + groupName + '"]');
    if (!wasActive) {
      chip.classList.add('qt-chip-active');
      if (chip.dataset.value === 'Autre') {
        otherInput.classList.remove('qt-hidden');
        otherInput.focus();
      } else if (otherInput) {
        otherInput.classList.add('qt-hidden');
      }
    } else if (otherInput) {
      otherInput.classList.add('qt-hidden');
    }
  }

    score = 0;

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Raleway:wght@400;600;700;800&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Raleway', sans-serif; background: #fff; padding: 0; }

  .container { padding: 0; }

  .layout {
    display: flex;
    gap: 20px;
    align-items: stretch;
  }

  .video-side {
    flex-shrink: 0;
    width: 640px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .video-zone {
    width: 640px;
    height: 360px;
    border-radius: 22px;
    overflow: hidden;
    border: 1.5px solid #E8D5D5;
    background: #FFFAFD;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .video-zone video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .description-box {
    background: #FFFAFD;
    border: 1.5px solid #E8D5D5;
    border-radius: 16px;
    padding: 14px 18px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex: 1;
  }

  .description-emoji {
    font-size: 18px;
    flex-shrink: 0;
  }

  .description {
    font-size: 14px;
    font-weight: 600;
    color: #450100;
    line-height: 1.4;
    margin: 0;
  }

  .options {
    flex: 1 1 380px;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .option-btn {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #fff;
    border: 1.5px solid #E8D5D5;
    border-radius: 999px;
    padding: 14px 22px;
    cursor: pointer;
    font-family: 'Raleway', sans-serif;
    font-size: 14px;
    font-weight: 600;
    color: #450100;
    text-align: left;
    transition: all 0.2s;
    width: 100%;
  }

  .option-btn.active {
    background: #DC143C;
    border-color: #DC143C;
    color: #fff;
    font-weight: 700;
  }

  .option-btn:hover:not(.active) {
    border-color: #DC143C;
    color: #DC143C;
  }

  @media (max-width: 768px) {
    .layout { flex-direction: column; }
    .video-side { width: 100%; }
    .video-zone { width: 100%; height: auto; aspect-ratio: 16/9; }
    .options { flex: 1; max-width: none; width: 100%; }
  }
</style>
</head>
<body>
<div class="container">

  <div class="layout">

    <div class="video-side">
      <div class="video-zone">
        <video id="videoDisplay" autoplay loop muted playsinline preload="metadata">
          <source id="videoSource" src="https://pljmpylo.github.io/merci-beaucul/dpo-mano-indirect-cercles.mp4" type="video/mp4">
        </video>
      </div>
      <div class="description-box">
        <span class="description-emoji">🔍</span>
        <p class="description" id="descDisplay">Cercles lents à travers le tissu ou la main</p>
      </div>
    </div>

    <div class="options">
      <button class="option-btn active" onclick="selectOption(this, 'dpo-mano-indirect-cercles.mp4', 'Cercles lents à travers le tissu ou la main')">
        Cercles
      </button>
      <button class="option-btn" onclick="selectOption(this, 'dpo-mano-indirect-tapoter.mp4', 'Petits tapotements rythmés sur la zone')">
        Tapoter
      </button>
      <button class="option-btn" onclick="selectOption(this, 'dpo-mano-indirect-haut-en-bas.mp4', 'Va-et-vient vertical sur la vulve')">
        Haut en bas
      </button>
      <button class="option-btn" onclick="selectOption(this, 'dpo-mano-indirect-encercler.mp4', 'La vulve encerclée entre les doigts à travers le tissu')">
        Encercler
      </button>
      <button class="option-btn" onclick="selectOption(this, 'dpo-mano-indirect-appuyer.mp4', 'Pression maintenue sur la zone')">
        Appuyer
      </button>
      <button class="option-btn" onclick="selectOption(this, 'dpo-mano-indirect-humping.mp4', 'Le bassin qui frotte contre la main ou un coussin')">
        Humping
      </button>
      <button class="option-btn" onclick="selectOption(this, 'dpo-mano-indirect-levres.mp4', 'Les lèvres massées à travers le tissu')">
        Les lèvres
      </button>
      <button class="option-btn" onclick="selectOption(this, 'dpo-mano-indirect-vagin.mp4', 'Pression à l\'entrée du vagin à travers le tissu')">
        L'entrée du vagin
      </button>
    </div>

  </div>

</div>

<script>
  function selectOption(btn, videoFile, description) {
    document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    var video = document.getElementById('videoDisplay');
    var source = document.getElementById('videoSource');
    source.src = 'https://pljmpylo.github.io/merci-beaucul/' + videoFile;
    video.load();
    video.play().catch(function() {});

    document.getElementById('descDisplay').textContent = description;

    sendHeight();
  }

  function sendHeight() {
    window.parent.postMessage({ iframeHeight: document.body.scrollHeight }, '*');
  }

  window.addEventListener('load', function() {
    sendHeight();
    new MutationObserver(sendHeight).observe(document.body, { childList: true, subtree: true, attributes: true });
  });
</script>
</body>
</html>

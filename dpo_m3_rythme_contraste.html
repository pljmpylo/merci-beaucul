<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Raleway:wght@400;600;700;800&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Raleway', sans-serif; background: #fff; padding: 0; }

  .container { padding: 0; }

  .label {
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #DC143C;
    margin-bottom: 14px;
  }

  .layout {
    display: flex;
    gap: 20px;
    align-items: stretch;
  }

  .media-side {
    flex-shrink: 0;
    width: 400px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .gif-zone {
    width: 400px;
    height: 480px;
    border-radius: 22px;
    overflow: hidden;
    border: 1.5px solid #E8D5D5;
    background: #FFFAFD;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .gif-zone img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .description-box {
    background: #FFFAFD;
    border: 1.5px solid #E8D5D5;
    border-radius: 16px;
    padding: 14px 18px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex: 1;
  }

  .description-emoji {
    font-size: 18px;
    flex-shrink: 0;
  }

  .description {
    font-size: 14px;
    font-weight: 600;
    color: #450100;
    line-height: 1.4;
    margin: 0;
  }

  .options {
    flex: 1 1 380px;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .option-btn {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #fff;
    border: 1.5px solid #E8D5D5;
    border-radius: 999px;
    padding: 14px 22px;
    cursor: pointer;
    font-family: 'Raleway', sans-serif;
    font-size: 14px;
    font-weight: 600;
    color: #450100;
    text-align: left;
    transition: all 0.2s;
    width: 100%;
  }

  .option-btn.active {
    background: #DC143C;
    border-color: #DC143C;
    color: #fff;
    font-weight: 700;
  }

  .option-btn:hover:not(.active) {
    border-color: #DC143C;
    color: #DC143C;
  }

  .option-num {
    font-size: 10px;
    font-weight: 800;
    opacity: 0.5;
    margin-left: 10px;
    flex-shrink: 0;
  }

  @media (max-width: 768px) {
    .layout { flex-direction: column; }
    .media-side { width: 100%; }
    .gif-zone { width: 100%; height: 380px; }
    .options { flex: 1; max-width: none; width: 100%; }
  }
</style>
</head>
<body>
<div class="container">

  <p class="label">4. Contraste vs Durée</p>

  <div class="layout">

    <div class="media-side">
      <div class="gif-zone">
        <img id="gifDisplay" src="https://pljmpylo.github.io/merci-beaucul/eveiller-meme-rythme.gif" alt="Démonstration" />
      </div>
      <div class="description-box">
        <span class="description-emoji">🔍</span>
        <p class="description" id="descDisplay">Mouvement constant et prévisible, sans variation</p>
      </div>
    </div>

    <div class="options">
      <button class="option-btn active" onclick="selectOption(this, 'eveiller-meme-rythme.gif', 'Mouvement constant et prévisible, sans variation')">
        Rythme régulier
        <span class="option-num">A</span>
      </button>
      <button class="option-btn" onclick="selectOption(this, 'eveiller-rythme-irregulier.gif', 'Variations de vitesse et d\'intensité')">
        Rythme irrégulier
        <span class="option-num">B</span>
      </button>
    </div>

  </div>

</div>

<script>
  function selectOption(btn, gif, description) {
    document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('gifDisplay').src = 'https://pljmpylo.github.io/merci-beaucul/' + gif;
    document.getElementById('descDisplay').textContent = description;
    sendHeight();
  }

  function sendHeight() {
    window.parent.postMessage({ iframeHeight: document.body.scrollHeight }, '*');
  }

  window.addEventListener('load', function() {
    sendHeight();
    new MutationObserver(sendHeight).observe(document.body, { childList: true, subtree: true, attributes: true });
  });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Curseur d'excitation - Programme C.O.M.E.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    --blue: #2F6FE4;
    --blue-soft: rgba(47,111,228,0.18);
    --blue-line: rgba(47,111,228,0.4);
    --blue-faint: rgba(47,111,228,0.06);
    --yellow: #F7FF59;
    --yellow-soft: rgba(247,255,89,0.35);
    --ink: #1c1c1c;
    font-family: 'Raleway', Arial, sans-serif;
    color: var(--ink);
    background: #fff;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .cc-shell { max-width: 640px; margin: 0 auto; padding: 8px 12px 14px; }

  .cc-card {
    border: 1.5px solid var(--blue-soft);
    border-radius: 22px;
    background: #fff;
    padding: 26px 28px 22px;
    animation: ccFadeUp 0.45s ease both;
  }
  @keyframes ccFadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .cc-eyebrow {
    display: inline-block;
    color: var(--blue);
    border: 1px solid var(--blue-soft);
    border-radius: 999px;
    padding: 5px 14px;
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 16px;
  }
  .cc-title {
    font-weight: 800;
    font-size: clamp(20px, 4.2vw, 26px);
    line-height: 1.2;
    letter-spacing: -0.01em;
    color: var(--ink);
    margin-bottom: 4px;
    text-wrap: balance;
  }
  .cc-title em {
    font-style: normal;
    color: var(--blue);
    background: linear-gradient(transparent 62%, var(--yellow) 62%);
    padding: 0 4px;
  }
  .cc-sub { font-size: 14px; font-weight: 500; color: var(--blue); margin-bottom: 8px; }

  /* ---------- curseur ---------- */
  .cc-slider { position: relative; margin: 0 18px; padding-top: 68px; }

  /* bulle au-dessus du curseur */
  .cc-bubble {
    position: absolute;
    top: 0;
    left: 0;
    width: 46px; height: 46px;
    margin-left: -23px;
    display: flex; align-items: center; justify-content: center;
    background: var(--yellow);
    color: var(--blue);
    border: 1.5px solid var(--blue);
    border-radius: 50%;
    font-weight: 800;
    font-size: 21px;
    line-height: 1;
    padding-bottom: 1px;
    font-variant-numeric: tabular-nums;
    z-index: 2;
  }
  .cc-bubble::after {
    content: '';
    position: absolute;
    left: 50%; bottom: -7px;
    width: 12px; height: 12px;
    background: var(--yellow);
    border-right: 1.5px solid var(--blue);
    border-bottom: 1.5px solid var(--blue);
    transform: translateX(-50%) rotate(45deg);
    z-index: -1;
  }

  .cc-track { position: relative; height: 8px; background: var(--blue-soft); border-radius: 8px; }
  .cc-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--blue); border-radius: 8px; }
  .cc-knob {
    position: absolute; top: 50%; left: 0;
    width: 24px; height: 24px;
    margin: -12px 0 0 -12px;
    background: var(--blue);
    border: 4px solid #fff;
    border-radius: 50%;
    cursor: grab;
    box-shadow: 0 0 0 1.5px var(--blue);
    z-index: 2;
  }
  .cc-bubble, .cc-knob { transition: left 160ms ease; }
  .cc-fill { transition: width 160ms ease; }
  .cc-slider.cc-drag .cc-bubble, .cc-slider.cc-drag .cc-knob, .cc-slider.cc-drag .cc-fill { transition: none; }

  /* zone de saisie : large pour le doigt, couvre la piste et les chiffres */
  .cc-hit {
    position: absolute; left: -18px; right: -18px; top: 52px; bottom: 0;
    touch-action: none; cursor: pointer; z-index: 3;
    -webkit-tap-highlight-color: transparent;
  }
  .cc-hit:focus { outline: none; }
  .cc-hit:focus-visible ~ .cc-track .cc-knob { outline: 2px solid var(--blue); outline-offset: 5px; }
  .cc-slider.cc-drag .cc-knob { cursor: grabbing; }
  .cc-tick { cursor: pointer; }

  /* graduations 1 à 10 */
  .cc-ticks { position: relative; height: 30px; margin-top: 12px; }
  .cc-tick {
    position: absolute; top: 0;
    width: 24px; margin-left: -12px;
    text-align: center;
    font-size: 13px; font-weight: 600; line-height: 24px;
    color: var(--blue);
    opacity: 0.55;
    font-variant-numeric: tabular-nums;
  }
  .cc-tick.cc-on { opacity: 1; font-weight: 800; }

  @media (max-width: 480px) {
    .cc-card { padding: 22px 18px 18px; border-radius: 18px; }
    .cc-slider { margin: 0 14px; }
    .cc-tick { font-size: 12px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .cc-card { animation: none; }
    .cc-bubble, .cc-knob, .cc-fill { transition: none; }
  }
</style>
<style id="cc-noscroll">
  /* Dans l'iframe Kajabi, c'est la page parente qui défile : aucune barre interne */
  html.cc-embedded, html.cc-embedded body { overflow: hidden !important; }
</style>
<script>try{if(window.self!==window.top)document.documentElement.classList.add('cc-embedded');}catch(e){document.documentElement.classList.add('cc-embedded');}</script>
</head>
<body>
<div class="cc-shell">
  <div class="cc-card" id="cc-card">
    <span class="cc-eyebrow">Ton curseur</span>
    <h1 class="cc-title">Garde ton niveau d’excitation <em>environ là</em></h1>
    <p class="cc-sub">Sur une échelle de 1 à 10, glisse le curseur</p>

    <div class="cc-slider" id="cc-slider">
      <div class="cc-bubble" id="cc-bubble" aria-hidden="true">1</div>
      <div class="cc-track">
        <div class="cc-fill" id="cc-fill"></div>
        <div class="cc-knob" id="cc-knob"></div>
      </div>
      <div class="cc-ticks" id="cc-ticks" aria-hidden="true"></div>
      <div class="cc-hit" id="cc-hit" role="slider" tabindex="0" aria-label="Niveau d’excitation" aria-valuemin="1" aria-valuemax="10" aria-valuenow="1"></div>
    </div>
  </div>
</div>

<script>
(function () {
  var level = 1;
  var pct = function (v) { return ((v - 1) / 9) * 100; };

  var slider = document.getElementById('cc-slider');
  var hit = document.getElementById('cc-hit');
  var bubble = document.getElementById('cc-bubble');
  var knob = document.getElementById('cc-knob');
  var fill = document.getElementById('cc-fill');
  var ticks = document.getElementById('cc-ticks');
  var tickEls = [];

  for (var i = 1; i <= 10; i++) {
    var t = document.createElement('span');
    t.className = 'cc-tick';
    t.style.left = pct(i) + '%';
    t.textContent = i;
    ticks.appendChild(t);
    tickEls.push(t);
  }

  function set(v) {
    v = Math.max(1, Math.min(10, v));
    level = v;
    var p = pct(v) + '%';
    bubble.style.left = p;
    knob.style.left = p;
    fill.style.width = p;
    bubble.textContent = v;
    hit.setAttribute('aria-valuenow', v);
    tickEls.forEach(function (el, k) { el.classList.toggle('cc-on', k + 1 === v); });
  }

  function fromPointer(e) {
    var r = document.querySelector('.cc-track').getBoundingClientRect();
    var ratio = (e.clientX - r.left) / r.width;
    set(Math.round(Math.max(0, Math.min(1, ratio)) * 9) + 1);
  }

  var dragging = false;
  hit.addEventListener('pointerdown', function (e) {
    dragging = true;
    slider.classList.add('cc-drag');
    try { hit.setPointerCapture(e.pointerId); } catch (err) {}
    fromPointer(e);
    e.preventDefault();
  });
  hit.addEventListener('pointermove', function (e) { if (dragging) fromPointer(e); });
  function end() { dragging = false; slider.classList.remove('cc-drag'); }
  hit.addEventListener('pointerup', end);
  hit.addEventListener('pointercancel', end);
  hit.addEventListener('lostpointercapture', end);

  hit.addEventListener('keydown', function (e) {
    var k = e.key;
    if (k === 'ArrowRight' || k === 'ArrowUp') set(level + 1);
    else if (k === 'ArrowLeft' || k === 'ArrowDown') set(level - 1);
    else if (k === 'Home') set(1);
    else if (k === 'End') set(10);
    else return;
    e.preventDefault();
  });

  set(1);

  /* ================= auto-hauteur (iframe Kajabi) ================= */
  function post() {
    try {
      window.parent.postMessage({ type: 'come-quiz-height', height: Math.ceil(document.body.getBoundingClientRect().height) }, '*');
    } catch (e) {}
  }
  window.addEventListener('load', post);
  window.addEventListener('resize', post);
  if (window.ResizeObserver) { new ResizeObserver(post).observe(document.body); }
  else { setInterval(post, 600); }
})();
</script>
</body>
</html>

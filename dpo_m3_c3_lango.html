<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Raleway:wght@400;600;700;800&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Raleway', sans-serif; background: #fff; padding: 0; }

  .container { padding: 0; }

  .tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 18px;
  }

  .tab-btn {
    flex: 1 1 auto;
    min-width: 110px;
    background: #fff;
    border: 1.5px solid #E8D5D5;
    border-radius: 999px;
    padding: 10px 14px;
    cursor: pointer;
    font-family: 'Raleway', sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: #450100;
    text-align: center;
    transition: all 0.2s;
  }

  .tab-btn.active {
    background: #DC143C;
    border-color: #DC143C;
    color: #fff;
    font-weight: 700;
  }

  .tab-btn:hover:not(.active) {
    border-color: #DC143C;
    color: #DC143C;
  }

  .layout {
    display: flex;
    gap: 20px;
    align-items: stretch;
  }

  .video-side {
    flex-shrink: 0;
    width: 400px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .video-zone {
    width: 400px;
    height: 480px;
    border-radius: 22px;
    overflow: hidden;
    border: 1.5px solid #E8D5D5;
    background: #FFFAFD;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .video-zone video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .video-zone img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .schema-placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 30px;
  }

  .schema-placeholder svg {
    width: 220px;
    height: 220px;
  }

  .schema-label {
    font-size: 14px;
    color: #8a1b1a;
    text-align: center;
    line-height: 1.4;
    font-style: italic;
    opacity: 0.85;
  }

  .schema-label strong {
    display: block;
    font-style: normal;
    font-weight: 700;
    font-size: 17px;
    color: #450100;
    margin-bottom: 6px;
  }

  .description-box {
    background: #FFFAFD;
    border: 1.5px solid #E8D5D5;
    border-radius: 16px;
    padding: 14px 18px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex: 1;
  }

  .description-emoji {
    font-size: 18px;
    flex-shrink: 0;
  }

  .description {
    font-size: 14px;
    font-weight: 600;
    color: #450100;
    line-height: 1.4;
    margin: 0;
  }

  .options {
    flex: 1 1 380px;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .option-btn {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #fff;
    border: 1.5px solid #E8D5D5;
    border-radius: 999px;
    padding: 14px 22px;
    cursor: pointer;
    font-family: 'Raleway', sans-serif;
    font-size: 14px;
    font-weight: 600;
    color: #450100;
    text-align: left;
    transition: all 0.2s;
    width: 100%;
  }

  .option-btn.active {
    background: #DC143C;
    border-color: #DC143C;
    color: #fff;
    font-weight: 700;
  }

  .option-btn:hover:not(.active) {
    border-color: #DC143C;
    color: #DC143C;
  }

  .option-num {
    font-size: 10px;
    font-weight: 800;
    opacity: 0.5;
    margin-left: 10px;
    flex-shrink: 0;
  }

  .empty-state {
    flex: 1 1 380px;
    max-width: 480px;
    background: #FFFAFD;
    border: 1.5px dashed #E8D5D5;
    border-radius: 22px;
    padding: 30px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 10px;
    min-height: 480px;
  }

  .empty-state-emoji { font-size: 32px; }

  .empty-state-text {
    color: #8a1b1a;
    font-size: 14px;
    line-height: 1.5;
    font-style: italic;
  }

  @media (max-width: 768px) {
    .layout { flex-direction: column; }
    .video-side { width: 100%; }
    .video-zone { width: 100%; height: 380px; }
    .options, .empty-state { flex: 1; max-width: none; width: 100%; min-height: auto; }
    .schema-placeholder svg { width: 180px; height: 180px; }
    .tab-btn { min-width: 80px; font-size: 12px; padding: 9px 10px; }
  }
</style>
</head>
<body>
<div class="container">

  <div class="tabs">
    <button class="tab-btn active" data-cat="A">A. Haut / bas</button>
    <button class="tab-btn" data-cat="B">B. Cercle</button>
    <button class="tab-btn" data-cat="C">C. Gauche / droite</button>
    <button class="tab-btn" data-cat="D">D. Vibrations</button>
    <button class="tab-btn" data-cat="E">E. Aspirer</button>
    <button class="tab-btn" data-cat="F">F. Pénétration</button>
  </div>

  <div class="layout">

    <div class="video-side">
      <div class="video-zone" id="videoZone"></div>
      <div class="description-box">
        <span class="description-emoji">👅</span>
        <p class="description" id="descDisplay"></p>
      </div>
    </div>

    <div id="optionsContainer"></div>

  </div>

</div>

<script>
  const categories = {
    A: {
      schema: `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="#8a1b1a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M50 18 L50 82"/>
          <path d="M40 28 L50 18 L60 28"/>
          <path d="M40 72 L50 82 L60 72"/>
          <circle cx="50" cy="50" r="6" fill="#DC143C" stroke="none"/>
        </svg>
        <p class="schema-label"><strong>A. Haut / bas</strong>Va-et-vient vertical de la langue</p>`,
      variants: [
        { label: 'Bout de langue, lentement', desc: 'Bout de la langue seul qui va de haut en bas, lentement.', media: 'https://pljmpylo.github.io/merci-beaucul/dpo_video_langue_douce.gif' },
        { label: 'Plat de la langue', desc: 'Même geste avec le plat de la langue.' },
        { label: 'Appuyer / frôler', desc: 'Même geste en appuyant un peu plus, puis à peine frôlant.' },
        { label: 'Variations de rythme', desc: 'Va-et-vient rapide puis très lent puis normal puis arrêt, puis rouler le gland du clitoris hyper lentement.' }
      ]
    },
    B: {
      schema: `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="#8a1b1a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="50" cy="50" r="28"/>
          <path d="M75 42 L78 50 L70 53"/>
          <circle cx="50" cy="50" r="6" fill="#DC143C" stroke="none"/>
        </svg>
        <p class="schema-label"><strong>B. Cercle</strong>Petits ou grands ronds, dans les deux sens</p>`,
      variants: [
        { label: 'Petits cercles lents', desc: 'Langue qui fait de petits cercles lents.' },
        { label: 'Cercles plus grands', desc: 'Cercles plus grands.' },
        { label: 'Changement de sens', desc: 'Changement de sens du cercle.' }
      ]
    },
    C: {
      schema: `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="#8a1b1a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 50 L82 50"/>
          <path d="M28 40 L18 50 L28 60"/>
          <path d="M72 40 L82 50 L72 60"/>
          <circle cx="50" cy="50" r="6" fill="#DC143C" stroke="none"/>
        </svg>
        <p class="schema-label"><strong>C. Gauche / droite</strong>Balayage horizontal, comme un essuie-glace</p>`,
      variants: [
        { label: 'Doucement', desc: 'Bout de la langue qui va doucement de gauche à droite.' },
        { label: 'Plus rapide', desc: 'Même geste un peu plus rapide.' }
      ]
    },
    D: {
      schema: `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="#8a1b1a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 45 Q22 33 30 45 T45 45 T60 45 T75 45 T85 45"/>
          <circle cx="30" cy="65" r="2.5" fill="#DC143C" stroke="none"/>
          <circle cx="45" cy="68" r="2.5" fill="#DC143C" stroke="none"/>
          <circle cx="60" cy="65" r="2.5" fill="#DC143C" stroke="none"/>
          <circle cx="75" cy="68" r="2.5" fill="#DC143C" stroke="none"/>
        </svg>
        <p class="schema-label"><strong>D. Vibrations &amp; tapotements</strong>Pulsations sur place ou mini coups répétés</p>`,
      variants: [
        { label: 'Vibration sur place', desc: 'Langue à peine sortie, pointe vers le palais, qui pulse sur place.' },
        { label: 'Tapotements rapides', desc: 'Série de petits tapotements rapides au même endroit.' },
        { label: 'Rythmes variés', desc: 'Varier les rythmes des tapotements.' }
      ]
    },
    E: {
      schema: `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="#8a1b1a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M25 50 Q35 35 50 38 Q65 35 75 50 Q65 62 50 60 Q35 62 25 50 Z"/>
          <path d="M25 50 Q50 50 75 50" stroke-dasharray="2 3"/>
          <circle cx="50" cy="50" r="4" fill="#DC143C" stroke="none"/>
        </svg>
        <p class="schema-label"><strong>E. Aspirer &amp; embrasser</strong>Bouche posée, succion douce, baiser</p>`,
      variants: [
        { label: 'Bisou', desc: 'Lèvres qui se posent comme pour un bisou, se referment doucement, puis se rouvrent.' },
        { label: 'Bouche qui englobe', desc: 'Bouche plus ouverte qui englobe plus large, comme si on mangeait la zone.' }
      ]
    },
    F: {
      schema: `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="#8a1b1a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M30 50 L70 50"/>
          <path d="M60 40 L70 50 L60 60"/>
          <ellipse cx="78" cy="50" rx="6" ry="14" fill="#FFFAFD"/>
        </svg>
        <p class="schema-label"><strong>F. Pénétration</strong>Langue qui entre dans le vagin</p>`,
      variants: [
        { label: 'Pénétration douce', desc: 'Pénétration douce avec la langue, en entrant lentement.' },
        { label: 'Ouverture de la mâchoire', desc: 'Ouvrir la mâchoire pour donner plus d\'amplitude au mouvement.' },
        { label: 'Agripper par les hanches', desc: 'Agripper les hanches pour amener le bassin vers soi pendant la pénétration.' }
      ]
    }
  };

  let currentCategory = 'A';
  let currentVariantIdx = 0;

  function renderMedia() {
    const cat = currentCategory;
    const zone = document.getElementById('videoZone');
    const variants = categories[cat].variants;
    const variant = variants ? variants[currentVariantIdx] : null;

    if (variant && variant.media) {
      const ext = variant.media.split('.').pop().toLowerCase().split('?')[0];
      if (ext === 'mp4' || ext === 'webm') {
        zone.innerHTML = `<video autoplay loop muted playsinline preload="metadata"><source src="${variant.media}" type="video/${ext}"></video>`;
      } else {
        zone.innerHTML = `<img src="${variant.media}" alt="">`;
      }
    } else {
      zone.innerHTML = `<div class="schema-placeholder">${categories[cat].schema}</div>`;
    }
  }

  function selectCategory(cat, btn) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    currentCategory = cat;
    currentVariantIdx = 0;

    const optsBox = document.getElementById('optionsContainer');
    if (categories[cat].empty) {
      optsBox.innerHTML = `
        <div class="empty-state">
          <div class="empty-state-emoji">✍️</div>
          <p class="empty-state-text">Mouvements à compléter</p>
        </div>`;
      document.getElementById('descDisplay').textContent = categories[cat].placeholderDesc;
    } else {
      let html = '<div class="options">';
      categories[cat].variants.forEach((v, i) => {
        html += `<button class="option-btn ${i === 0 ? 'active' : ''}" onclick="selectVariant(this, ${i})">${v.label}</button>`;
      });
      html += '</div>';
      optsBox.innerHTML = html;
      document.getElementById('descDisplay').textContent = categories[cat].variants[0].desc;
    }

    renderMedia();
    sendHeight();
  }

  function selectVariant(btn, idx) {
    document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentVariantIdx = idx;
    document.getElementById('descDisplay').textContent = categories[currentCategory].variants[idx].desc;
    renderMedia();
    sendHeight();
  }

  function sendHeight() {
    window.parent.postMessage({ iframeHeight: document.body.scrollHeight }, '*');
  }

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', function() {
      selectCategory(this.dataset.cat, this);
    });
  });

  selectCategory('A', document.querySelector('.tab-btn[data-cat="A"]'));

  window.addEventListener('load', function() {
    sendHeight();
    new MutationObserver(sendHeight).observe(document.body, { childList: true, subtree: true, attributes: true });
  });
</script>
</body>
</html>

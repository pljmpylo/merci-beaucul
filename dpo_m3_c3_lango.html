<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Raleway:wght@400;600;700;800&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Raleway', sans-serif; background: #fff; padding: 0; }

  .container { padding: 0; }

  .layout {
    display: flex;
    gap: 20px;
    align-items: flex-start;
  }

  .video-side {
    flex-shrink: 0;
    width: 480px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .video-zone {
    width: 480px;
    aspect-ratio: 1080 / 608;
    border-radius: 22px;
    overflow: hidden;
    border: 1.5px solid #E8D5D5;
    background: #FFFAFD;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .video-zone video,
  .video-zone img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .schema-placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 30px;
  }

  .coming-soon {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 30px;
    text-align: center;
  }

  .coming-soon-emoji {
    font-size: 38px;
    opacity: 0.7;
  }

  .coming-soon-text {
    font-family: 'Raleway', sans-serif;
    font-size: 16px;
    font-weight: 700;
    color: #8a1b1a;
    line-height: 1.4;
  }

  .schema-placeholder svg {
    width: 220px;
    height: 220px;
  }

  .schema-label {
    font-size: 14px;
    color: #8a1b1a;
    text-align: center;
    line-height: 1.4;
    font-style: italic;
    opacity: 0.85;
  }

  .schema-label strong {
    display: block;
    font-style: normal;
    font-weight: 700;
    font-size: 17px;
    color: #450100;
    margin-bottom: 6px;
  }

  .description-box {
    background: #FFFAFD;
    border: 1.5px solid #E8D5D5;
    border-radius: 16px;
    padding: 14px 18px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .description-emoji {
    font-size: 18px;
    flex-shrink: 0;
  }

  .description {
    font-size: 14px;
    font-weight: 600;
    color: #450100;
    line-height: 1.4;
    margin: 0;
  }

  /* Accordéon */
  .accordion {
    flex: 1 1 480px;
    max-width: 600px;
    display: flex;
    flex-direction: column;
  }

  .section {
    border-bottom: 1px solid #E8D5D5;
  }

  .section:last-child {
    border-bottom: none;
  }

  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    background: transparent;
    border: none;
    padding: 22px 6px;
    font-family: 'Raleway', sans-serif;
    font-size: 18px;
    font-weight: 700;
    color: #450100;
    cursor: pointer;
    text-align: left;
    transition: color 0.2s;
    letter-spacing: -0.2px;
  }

  .section-header:hover {
    color: #DC143C;
  }

  .section.open .section-header {
    color: #DC143C;
    padding-bottom: 12px;
  }

  .section.has-active:not(.open) .section-header {
    color: #DC143C;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .header-count {
    font-size: 12px;
    font-weight: 700;
    color: #8a1b1a;
    opacity: 0.7;
    background: #FFFAFD;
    border: 1px solid #E8D5D5;
    border-radius: 999px;
    padding: 3px 11px;
    letter-spacing: 0;
  }

  .section.open .header-count,
  .section.has-active .header-count {
    border-color: #DC143C;
    color: #DC143C;
    opacity: 1;
  }

  .chevron {
    transition: transform 0.25s ease;
    font-size: 16px;
    color: #8a1b1a;
    line-height: 1;
  }

  .section.open .chevron {
    transform: rotate(180deg);
    color: #DC143C;
  }

  .section-body {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.3s ease;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .section.open .section-body {
    max-height: 700px;
    padding: 6px 0 22px;
  }

  .option-btn {
    display: flex;
    align-items: center;
    background: #fff;
    border: 1.5px solid #E8D5D5;
    border-radius: 999px;
    padding: 14px 24px;
    cursor: pointer;
    font-family: 'Raleway', sans-serif;
    font-size: 15px;
    font-weight: 600;
    color: #450100;
    text-align: left;
    transition: all 0.2s;
    width: 100%;
    line-height: 1.3;
  }

  .option-btn.active {
    background: #DC143C;
    border-color: #DC143C;
    color: #fff;
    font-weight: 700;
  }

  .option-btn:hover:not(.active) {
    border-color: #DC143C;
    color: #DC143C;
  }

  @media (max-width: 768px) {
    .layout { flex-direction: column; }
    .video-side { width: 100%; }
    .video-zone { width: 100%; }
    .accordion { flex: 1; max-width: none; width: 100%; }
    .schema-placeholder svg { width: 180px; height: 180px; }
  }
</style>
</head>
<body>
<div class="container">

  <div class="layout">

    <div class="video-side">
      <div class="video-zone" id="videoZone"></div>
      <div class="description-box">
        <span class="description-emoji">👅</span>
        <p class="description" id="descDisplay"></p>
      </div>
    </div>

    <div class="accordion" id="accordion"></div>

  </div>

</div>

<script>
  const sections = [
    {

          <path d="M50 18 L50 82"/>
          <path d="M40 28 L50 18 L60 28"/>
          <path d="M40 72 L50 82 L60 72"/>
          <circle cx="50" cy="50" r="6" fill="#DC143C" stroke="none"/>
        </svg>
        <p class="schema-label"><strong>Haut / bas</strong>Va-et-vient vertical de la langue</p>`,
      variants: [
        { label: 'Bout de langue, lentement', desc: 'Bout de la langue seul qui va de haut en bas, lentement.', media: 'https://pljmpylo.github.io/merci-beaucul/dpo_video_vertical_bout.mp4', speed: 1 },
        { label: 'Plat de la langue', desc: 'Même geste avec le plat de la langue.', media: 'https://pljmpylo.github.io/merci-beaucul/dpo_video_vertical_plat.mp4' },
        { label: 'Appuyer / frôler', desc: 'Même geste en appuyant un peu plus, puis à peine frôlant.', media: 'https://pljmpylo.github.io/merci-beaucul/dpo_m3_video_vertical_appui.mp4' },
        { label: 'Variations de rythme', desc: 'Va-et-vient rapide puis très lent puis normal puis arrêt, puis rouler le gland du clitoris hyper lentement.', media: 'https://pljmpylo.github.io/merci-beaucul/dpo_video_vertical_rythme.mp4' }
      ]
    },
    {
      label: 'Cercle',
      schema: `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="#8a1b1a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="50" cy="50" r="28"/>
          <path d="M75 42 L78 50 L70 53"/>
          <circle cx="50" cy="50" r="6" fill="#DC143C" stroke="none"/>
        </svg>
        <p class="schema-label"><strong>Cercle</strong>Petits ou grands ronds, dans les deux sens</p>`,
      variants: [
        { label: 'Petits cercles lents', desc: 'Langue qui fait de petits cercles lents.', media: 'https://pljmpylo.github.io/merci-beaucul/dpo_video_cercles_petit.mp4', speed: 1 },
        { label: 'Cercles plus grands', desc: 'Cercles plus grands.', media: 'https://pljmpylo.github.io/merci-beaucul/dpo_video_cercles_big.mp4' },
        { label: 'Changement de sens', desc: 'Changement de sens du cercle.', media: 'https://pljmpylo.github.io/merci-beaucul/dpo_video_cercles_sens.mp4' },
        { label: 'Autour / Sur le clitoris', desc: 'Cercles autour du clitoris ou directement dessus.', media: 'https://pljmpylo.github.io/merci-beaucul/dpo_video_cercles_clito.mp4' }
      ]
    },
    {
      label: 'Balayage',
      schema: `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="#8a1b1a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 50 L82 50"/>
          <path d="M28 40 L18 50 L28 60"/>
          <path d="M72 40 L82 50 L72 60"/>
          <circle cx="50" cy="50" r="6" fill="#DC143C" stroke="none"/>
        </svg>
        <p class="schema-label"><strong>Balayage</strong>Balayage horizontal, comme un essuie-glace</p>`,
      variants: [
        { label: 'Doucement', desc: 'Bout de la langue qui va doucement de gauche à droite.', media: 'https://pljmpylo.github.io/merci-beaucul/dpo_m3_video_horizontal_lent.mp4', speed: 1 },
        { label: 'Plus rapide', desc: 'Même geste un peu plus rapide.', media: 'https://pljmpylo.github.io/merci-beaucul/dpo_video_horizontal_fast.mp4' },
        { label: 'Sur le clitoris', desc: 'Balayage de gauche à droite directement sur le clitoris.', media: 'https://pljmpylo.github.io/merci-beaucul/dpo_video_horizontal_clito.mp4' }
      ]
    },
    {
      label: 'Vibrations & tapotements',
      schema: `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="#8a1b1a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 45 Q22 33 30 45 T45 45 T60 45 T75 45 T85 45"/>
          <circle cx="30" cy="65" r="2.5" fill="#DC143C" stroke="none"/>
          <circle cx="45" cy="68" r="2.5" fill="#DC143C" stroke="none"/>
          <circle cx="60" cy="65" r="2.5" fill="#DC143C" stroke="none"/>
          <circle cx="75" cy="68" r="2.5" fill="#DC143C" stroke="none"/>
        </svg>
        <p class="schema-label"><strong>Vibrations &amp; tapotements</strong>Pulsations sur place ou mini coups répétés</p>`,
      variants: [
        { label: 'Vibration sur place', desc: 'Langue à peine sortie, pointe vers le palais, qui pulse sur place.', media: 'https://pljmpylo.github.io/merci-beaucul/dpo_video_tapes_place.mp4' },
        { label: 'Tapotements rapides', desc: 'Série de petits tapotements rapides au même endroit.', media: 'https://pljmpylo.github.io/merci-beaucul/dpo_video_tapes_fast.mp4' },
        { label: 'Rythmes variés', desc: 'Varier les rythmes des tapotements.', media: 'https://pljmpylo.github.io/merci-beaucul/dpo_m3_video_tapoter_rythme.mp4' },
        { label: 'Sur le clitoris', desc: 'Tapotements directement sur le clitoris.', media: 'https://pljmpylo.github.io/merci-beaucul/dpo_video_tapes_clito.mp4' }
      ]
    },
    {
      label: 'Aspirer & embrasser',
      schema: `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="#8a1b1a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M25 50 Q35 35 50 38 Q65 35 75 50 Q65 62 50 60 Q35 62 25 50 Z"/>
          <path d="M25 50 Q50 50 75 50" stroke-dasharray="2 3"/>
          <circle cx="50" cy="50" r="4" fill="#DC143C" stroke="none"/>
        </svg>
        <p class="schema-label"><strong>Aspirer &amp; embrasser</strong>Bouche posée, succion douce, baiser</p>`,
      variants: [
        { label: 'Bisou', desc: 'Lèvres qui se posent comme pour un bisou, se referment doucement, puis se rouvrent.', media: 'https://pljmpylo.github.io/merci-beaucul/dpo_m3_video_embrasser_bisou.mp4?v=2', speed: 1 },
        { label: 'Bouche qui englobe', desc: 'Bouche plus ouverte qui englobe plus large, comme si on mangeait la zone.', media: 'https://pljmpylo.github.io/merci-beaucul/dpo_m3_video_aspirer_englobe.mp4?v=2' }
      ]
    },
    {
      label: 'Pénétration',
      schema: `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="#8a1b1a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M30 50 L70 50"/>
          <path d="M60 40 L70 50 L60 60"/>
          <ellipse cx="78" cy="50" rx="6" ry="14" fill="#FFFAFD"/>
        </svg>
        <p class="schema-label"><strong>Pénétration</strong>Langue qui entre dans le vagin</p>`,
      variants: [
        { label: 'Pénétration douce', desc: 'Pénétration douce avec la langue, en entrant lentement.', media: 'https://pljmpylo.github.io/merci-beaucul/dpo_video_pen_douce.mp4', speed: 1 },
        { label: 'Ouverture de la mâchoire', desc: 'Ouvrir la mâchoire pour donner plus d\'amplitude au mouvement.', media: 'https://pljmpylo.github.io/merci-beaucul/dpo_video_pen_jaw.mp4' },
        { label: 'Agripper par les hanches', desc: 'Agripper les hanches pour amener le bassin vers soi pendant la pénétration.', media: 'https://pljmpylo.github.io/merci-beaucul/dpo_video_pen_hanches.mp4' }
      ]
    }
  ];

  let activeSection = 0;
  let activeVariant = 0;

  function buildAccordion() {
    const acc = document.getElementById('accordion');
    let html = '';
    sections.forEach((section, sIdx) => {
      const openClass = sIdx === activeSection ? 'open' : '';
      const hasActive = sIdx === activeSection ? 'has-active' : '';
      const count = section.variants.length;
      html += `
        <div class="section ${openClass} ${hasActive}" data-section="${sIdx}">
          <button class="section-header" data-section="${sIdx}">
            <span class="header-left">
              ${section.label}
              <span class="header-count">${count}</span>
            </span>
            <span class="chevron">▾</span>
          </button>
          <div class="section-body">`;
      section.variants.forEach((v, vIdx) => {
        const activeClass = (sIdx === activeSection && vIdx === activeVariant) ? 'active' : '';
        html += `<button class="option-btn ${activeClass}" data-section="${sIdx}" data-variant="${vIdx}">${v.label}</button>`;
      });
      html += `</div></div>`;
    });
    acc.innerHTML = html;

    acc.querySelectorAll('.section-header').forEach(header => {
      header.addEventListener('click', function() {
        toggleSection(parseInt(this.dataset.section));
      });
    });

    acc.querySelectorAll('.option-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        selectVariant(parseInt(this.dataset.section), parseInt(this.dataset.variant));
      });
    });
  }

  function toggleSection(sIdx) {
    document.querySelectorAll('.section').forEach((s, i) => {
      if (i === sIdx) {
        s.classList.toggle('open');
      } else {
        s.classList.remove('open');
      }
    });
    setTimeout(sendHeight, 320);
  }

  function selectVariant(sIdx, vIdx) {
    activeSection = sIdx;
    activeVariant = vIdx;

    document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.section').forEach(s => s.classList.remove('has-active'));

    const targetBtn = document.querySelector(`.option-btn[data-section="${sIdx}"][data-variant="${vIdx}"]`);
    if (targetBtn) targetBtn.classList.add('active');

    const targetSection = document.querySelector(`.section[data-section="${sIdx}"]`);
    if (targetSection) targetSection.classList.add('has-active');

    const section = sections[sIdx];
    const variant = section.variants[vIdx];
    const zone = document.getElementById('videoZone');

    if (variant.media) {
      const ext = variant.media.split('.').pop().toLowerCase().split('?')[0];
      if (ext === 'mp4' || ext === 'webm') {
        const speed = variant.speed || 2;
        zone.innerHTML = `<video autoplay loop muted playsinline preload="metadata"><source src="${variant.media}" type="video/${ext}"></video>`;
        const video = zone.querySelector('video');
        video.playbackRate = speed;
        video.addEventListener('loadedmetadata', () => {
          video.playbackRate = speed;
        });
      } else {
        zone.innerHTML = `<img src="${variant.media}" alt="">`;
      }
    } else {
      zone.innerHTML = `
        <div class="coming-soon">
          <div class="coming-soon-emoji">🎬</div>
          <div class="coming-soon-text">La vidéo arrive !</div>
        </div>`;
    }

    document.getElementById('descDisplay').textContent = variant.desc;
    sendHeight();
  }

  function sendHeight() {
    window.parent.postMessage({ iframeHeight: document.body.scrollHeight }, '*');
  }

  buildAccordion();
  selectVariant(0, 0);

  window.addEventListener('load', function() {
    sendHeight();
    new MutationObserver(sendHeight).observe(document.body, { childList: true, subtree: true, attributes: true });
  });
</script>
</body>
</html>

  }

    font-size: 0.95rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    white-space: nowrap;
    padding: 0.85rem 2.2rem;
    border: 1.5px solid var(--blue);
    border-radius: 10rem;
    transition: color 450ms ease;
    -webkit-tap-highlight-color: transparent;
  }
  .qt-btn::before {
    content: '';
    position: absolute;
    left: 0; right: 0; bottom: 0;
    top: 102%;
    background: var(--blue);
    transition: top 450ms ease;
    z-index: 0;
  }
  .qt-btn span { position: relative; z-index: 1; }
  .qt-btn:hover { color: var(--yellow); }
  .qt-btn:hover::before { top: 0; }
  .qt-btn-text { background: none; border: none; color: var(--muted); font-size: 13.5px; font-family: inherit; padding: 8px 4px; }
  .qt-btn-text:hover { color: var(--blue); }

  .qt-accordion-header {

  .qt-chip {

  .qt-chip:hover { border-color: var(--blue); background: var(--blue-faint); }
  .qt-chip[aria-pressed="true"] { background: var(--yellow); border-color: var(--blue); color: var(--blue); font-weight: 600; }

  @media (max-width: 460px) { .qt-chip { font-size: 12px; padding: 5px 8px; } }

    .qt-accordion-panel { padding: 14px 10px 16px; }

  @media print {

</style>

  var root = document.getElementById('qt-root');
  var state = { answers: {}, sel: {} };

  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

  /* hauteur d'un champ = hauteur de son contenu, ou de son exemple s'il est vide
     (scrollHeight vaut 0 tant que le toggle est fermé : on mesure à l'ouverture) */
  function autosize(ta) {
    var saved = ta.value;
    if (!saved) ta.value = ta.placeholder;
    ta.style.height = 'auto';
    ta.style.height = (ta.scrollHeight + 2) + 'px';
    ta.value = saved;
  }
  function autosizeIn(container) {
    container.querySelectorAll('.qt-textarea').forEach(autosize);
  }

  function accordion(id, title, inner) {
    return '<div class="qt-accordion" id="' + id + '">'

  }
  function tableWrap(rows) {

      + '<tbody>' + rows + '</tbody></table></div>';
  }
  function rowHTML(ci, cell) {
    return '<tr' + (ci === 5 ? ' class="qt-row-action"' : '') + '><th scope="row">' + COLS[ci] + '</th><td>' + cell + '</td></tr>';
  }

  function pickToggle(st, si) {
    var rows = '';
    COLS.forEach(function (c, ci) {

    html += '<h1>Mon cycle du <em>stress sexuel</em></h1>';

    html += '<div class="qt-prose">'
      + '<h2>Comprendre ton cycle de stress sexuel</h2>'
      + '<p>Le stress sexuel ne commence pas forcément au moment où tu éjacules ou quand tu sens que “ça va trop vite”. Il peut apparaître bien avant : au premier baiser, face à la nudité de l’autre, quand il faut répondre à un sexto, recevoir du sexe oral, pénétrer, parler de ses envies ou simplement sentir que le moment devient important.</p>'
      + '<p>Souvent, le cycle ressemble à ça : une situation déclenche une pensée automatique (“il faut que je bande”, “je dois assurer”, “je vais être jugé”, “je ne dois pas venir maintenant”) puis cette pensée crée une émotion, une réaction dans le corps et un réflexe. Tu peux te crisper, bloquer ton souffle, accélérer, plaisanter, éviter, te concentrer sur ton érection ou continuer alors que tu aurais envie de ralentir. Et, après, tu peux te juger ou avoir l’impression que le moment est “raté”. Le cycle recommence alors plus facilement la fois suivante.</p>'

      + '<p>Lis le tableau une première fois à froid. Ensuite, ne cherche pas à tout retenir ni à appliquer toutes les actions. Choisis une seule situation qui te parle — par exemple la pénétration, le sexe oral reçu, ou le moment juste après l’éjaculation — et regarde quel scénario ressemble le plus au tien. Tu peux compléter les lignes avec tes propres mots : les pensées, les sensations et les réactions sont personnelles.</p>'
      + '<p class="qt-punch">L’objectif n’est pas de ne plus jamais stresser. L’objectif est de ne plus laisser le stress prendre tout le volant.</p>'
      + '</div>';

    html += '<p class="qt-tip">Ouvre une situation : sélectionne les propositions qui te ressemblent et complète avec tes propres mots.</p>';

    html += '<div class="qt-accordion-list">';
    PICK.forEach(function (st, i) { html += pickToggle(st, i); });
    html += '</div>';

    html += '<div class="qt-print-box">'
      + '<div class="qt-print-title">Garde tes réponses</div>'
      + '<p class="qt-print-text">Imprime ton tableau ou garde-le en PDF pour retrouver tes réponses au fil du programme. Toutes les situations s’ouvrent automatiquement.</p>'
      + '<button type="button" class="qt-btn" id="qt-print-btn"><span>Imprimer mes réponses / PDF</span></button>'
      + '</div>';
    html += '<div class="qt-actions"><button type="button" class="qt-btn-text" id="qt-restart">↺ Recommencer</button></div>';

    root.innerHTML = html;

    root.querySelectorAll('.qt-accordion-header').forEach(function (h) {
      h.addEventListener('click', function () {
        var acc = h.parentNode;
        var open = acc.classList.toggle('qt-accordion-open');
        h.setAttribute('aria-expanded', open ? 'true' : 'false');
        if (open) autosizeIn(acc.querySelector('.qt-accordion-panel'));
      });
    });
    root.querySelectorAll('.qt-textarea').forEach(function (ta) {
      ta.addEventListener('input', function () {
        state.answers[ta.dataset.key] = ta.value;
        autosize(ta);
      });
    });
    root.querySelectorAll('.qt-chip').forEach(function (c) {
      c.addEventListener('click', function () {
        var on = c.getAttribute('aria-pressed') !== 'true';
        c.setAttribute('aria-pressed', on ? 'true' : 'false');
        if (on) state.sel[c.dataset.key] = 1; else delete state.sel[c.dataset.key];
      });
    });

    document.getElementById('qt-print-btn').addEventListener('click', function () {
      root.querySelectorAll('.qt-accordion').forEach(function (a) {
        if (!a.classList.contains('qt-accordion-open')) {
          a.classList.add('qt-accordion-open');
          a.querySelector('.qt-accordion-header').setAttribute('aria-expanded', 'true');
        }
        autosizeIn(a.querySelector('.qt-accordion-panel'));
      });
      window.print();
    });
    document.getElementById('qt-restart').addEventListener('click', function () {
      state = { answers: {}, sel: {} };
      build();
      window.scrollTo(0, 0);
    });
  }

  build();

  var rt;
  window.addEventListener('resize', function () {
    clearTimeout(rt);
    rt = setTimeout(function () {
      root.querySelectorAll('.qt-accordion-open .qt-accordion-panel').forEach(autosizeIn);
    }, 120);
  });

  /* ---------------- auto-hauteur (iframe Kajabi) ---------------- */
  (function () {
    function post() {
      try {
        window.parent.postMessage({ type: 'come-quiz-height', height: Math.ceil(document.body.getBoundingClientRect().height) }, '*');
      } catch (e) {}
    }
    window.addEventListener('load', post);
    window.addEventListener('resize', post);
    if (window.ResizeObserver) { new ResizeObserver(post).observe(document.body); }
    else { setInterval(post, 600); }
  })();

})();
</script>
<script id="qt-textarea-fit">
/* Champs texte : la case grandit avec le texte, jamais de barre de défilement interne */
(function(){
  function fit(t){ if(!t.getClientRects().length) return; if(t.scrollHeight>t.clientHeight+1){t.style.height=(t.scrollHeight+2)+'px';} }
  function fitAll(){ document.querySelectorAll('textarea').forEach(fit); }
  document.addEventListener('input',function(e){ if(e.target&&e.target.tagName==='TEXTAREA') fit(e.target); });
  window.addEventListener('resize',fitAll); window.addEventListener('load',fitAll);
  if(window.MutationObserver) new MutationObserver(fitAll).observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['class']});
  fitAll();
})();
</script>
</body>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz - Mon rapport au contrôle — Programme COME</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    --blue: #2F6FE4;
    --blue-soft: rgba(47,111,228,0.18);
    --blue-faint: rgba(47,111,228,0.06);
    --yellow: #F7FF59;
    --ink: #1c1c1c;
    --muted: #5b6273;
    font-family: 'Raleway', Arial, sans-serif;
    color: var(--ink);
    background: #fff;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  a, button { cursor: pointer; font-family: inherit; }
  :focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
  .qt-wrap { min-height: 100vh; }
  .qt-shell { max-width: 660px; margin: 0 auto; padding: 56px 24px 90px; }

  /* ---------- shared ---------- */
  .qt-hidden { display: none !important; }
  .qt-eyebrow {
    display: inline-block;
    color: var(--blue);
    border: 1px solid var(--blue-soft);
    border-radius: 999px;
    padding: 5px 14px;
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 24px;
  }

  /* ---------- CTA façon Mimétique ---------- */
  .qt-btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    overflow: hidden;
    background: var(--yellow);
    color: var(--blue);
    font-weight: 700;
    font-size: 0.95rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    white-space: nowrap;
    padding: 0.85rem 2.2rem;
    border: 1.5px solid var(--blue);
    border-radius: 10rem;
    transition: color 450ms ease;
    -webkit-tap-highlight-color: transparent;
  }
  .qt-btn::before {
    content: '';
    position: absolute;
    left: 0; right: 0; bottom: 0;
    top: 102%;
    background: var(--blue);
    transition: top 450ms ease;
    z-index: 0;
  }
  .qt-btn span { position: relative; z-index: 1; }
  .qt-btn .qt-arrow { display: inline-block; transition: transform 450ms ease; }
  .qt-btn:hover { color: var(--yellow); }
  .qt-btn:hover::before { top: 0; }
  .qt-btn:hover .qt-arrow { transform: translateX(5px); }
  .qt-btn:disabled { opacity: 0.4; pointer-events: none; }

  .qt-btn-outline { background: #fff; color: var(--blue); }
  .qt-btn-outline::before { background: var(--blue); }
  .qt-btn-outline:hover { color: var(--yellow); }

  @media (prefers-reduced-motion: reduce) {
    .qt-btn, .qt-btn::before, .qt-btn .qt-arrow, .qt-progress-bar { transition: none; }
    .qt-screen { animation: none; }
  }

  /* ---------- intro ---------- */
  .qt-screen { animation: qtFadeUp 0.45s ease both; }
  @keyframes qtFadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  #qt-intro h1 {
    font-size: clamp(34px, 6vw, 50px);
    font-weight: 800;
    line-height: 1.05;
    letter-spacing: -0.015em;
    margin-bottom: 24px;
  }
  #qt-intro h1 em {
    font-style: normal;
    color: var(--blue);
    background: linear-gradient(transparent 62%, var(--yellow) 62%);
    padding: 0 4px;
  }
  .qt-intro-text {
    font-size: 16.5px;
    color: var(--muted);
    max-width: 480px;
    margin-bottom: 14px;
  }
  #qt-intro .qt-btn { margin-top: 30px; }

  /* ---------- quiz ---------- */
  .qt-progress-label {
    font-size: 12px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--blue);
    margin-bottom: 10px;
    text-align: right;
  }
  .qt-progress-track {
    height: 8px;
    background: #fff;
    border: 1.5px solid var(--blue);
    border-radius: 99px;
    overflow: hidden;
    margin-bottom: 42px;
  }
  .qt-progress-bar {
    height: 100%;
    background: var(--yellow);
    border-right: 1.5px solid var(--blue);
    transition: width 350ms ease;
    width: 0%;
  }
  .qt-q-text {
    font-weight: 700;
    font-size: clamp(21px, 3.2vw, 26px);
    line-height: 1.3;
    color: var(--ink);
    margin-bottom: 30px;
  }
  .qt-options { display: flex; flex-direction: column; gap: 12px; }
  .qt-opt-btn {
    display: flex;
    align-items: center;
    gap: 16px;
    text-align: left;
    background: #fff;
    border: 1.5px solid var(--blue-soft);
    border-radius: 18px;
    padding: 16px 20px;
    font-size: 15.5px;
    line-height: 1.5;
    color: var(--ink);
    transition: border-color 180ms ease, background 180ms ease, box-shadow 180ms ease;
  }
  .qt-opt-btn:hover:not(:disabled) {
    border-color: var(--blue);
    box-shadow: 0 0 0 4px var(--blue-faint);
  }
  .qt-opt-btn.qt-selected {
    border-color: var(--blue);
    background: var(--yellow);
    box-shadow: 0 0 0 4px var(--blue-faint);
  }
  .qt-opt-letter {
    flex: 0 0 30px;
    width: 30px; height: 30px;
    border-radius: 50%;
    border: 1.5px solid var(--blue);
    background: #fff;
    color: var(--blue);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700;
    line-height: 1;
  }
  .qt-selected .qt-opt-letter { background: var(--blue); color: var(--yellow); }
  .qt-opt-text { flex: 1; }

  /* ---------- results ---------- */
  .qt-result-kicker {
    font-size: 12px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--blue);
    margin-bottom: 12px;
  }
  .qt-result-title {
    font-weight: 800;
    font-size: clamp(26px, 4.4vw, 34px);
    color: var(--ink);
    line-height: 1.18;
    margin-bottom: 20px;
  }
  .qt-result-title strong {
    font-weight: 800;
    color: var(--blue);
    background: linear-gradient(transparent 62%, var(--yellow) 62%);
  }
  .qt-result-desc {
    font-size: 16px;
    color: var(--muted);
    margin-bottom: 12px;
  }
  .qt-divider {
    border: none;
    border-top: 1.5px solid var(--blue-soft);
    margin: 38px 0;
  }
  .qt-ex-label {
    display: inline-block;
    background: var(--yellow);
    border: 1.5px solid var(--blue);
    color: var(--blue);
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    padding: 5px 15px;
    border-radius: 100px;
    margin: 6px 0 14px;
  }
  .qt-ex-intro {
    font-size: 15.5px;
    color: var(--ink);
    margin-bottom: 20px;
  }
  .qt-ex-intro u { text-decoration-color: var(--blue); text-decoration-thickness: 2px; text-underline-offset: 3px; }

  /* cartes à remplir : blanc + halo bleu */
  .qt-card, .qt-callout {
    background: #fff;
    border: 1.5px solid var(--blue);
    border-radius: 22px;
    padding: 22px 22px 24px;
    margin-bottom: 18px;
    box-shadow: 0 0 0 6px var(--blue-faint), 0 10px 28px rgba(47,111,228,0.12);
  }
  .qt-card-name, .qt-callout-label {
    font-weight: 800;
    font-size: 15px;
    color: var(--blue);
    margin-bottom: 16px;
  }
  .qt-field { margin-bottom: 16px; }
  .qt-field:last-child { margin-bottom: 0; }
  .qt-field-label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .qt-input, .qt-textarea {
    width: 100%;
    border: none;
    border-bottom: 1.5px solid var(--blue-soft);
    background: transparent;
    font-family: 'Raleway', sans-serif;
    font-size: 14.5px;
    color: var(--ink);
    padding: 6px 2px;
    transition: border-color 180ms ease;
  }
  .qt-input::placeholder, .qt-textarea::placeholder { color: #9aa1b0; }
  .qt-input:focus, .qt-textarea:focus { outline: none; border-color: var(--blue); }
  .qt-textarea {
    resize: vertical; min-height: 48px;
    border: 1.5px solid var(--blue-soft);
    border-radius: 12px;
    padding: 10px 12px;
  }
  .qt-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .qt-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }

  .qt-chip-group { display: flex; flex-wrap: wrap; gap: 8px; }
  .qt-chip {
    display: inline-flex; align-items: center; justify-content: center;
    background: #fff;
    border: 1.5px solid var(--blue-soft);
    border-radius: 100px;
    padding: 7px 15px;
    font-size: 13px;
    font-weight: 600;
    line-height: 1.3;
    color: var(--ink);
    transition: border-color 150ms ease, background 150ms ease, color 150ms ease;
  }
  .qt-chip:hover { border-color: var(--blue); color: var(--blue); }
  .qt-chip.qt-chip-active { background: var(--yellow); border-color: var(--blue); color: var(--blue); }
  .qt-chip-other-input { margin-top: 10px; }

  .qt-callout-example {
    font-style: italic;
    font-size: 13px;
    color: var(--muted);
    margin-top: 12px;
  }

  .qt-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 30px; }

  /* bloc impression */
  .qt-print-box {
    border-top: 1.5px solid var(--blue-soft);
    padding-top: 34px;
    margin-top: 40px;
    text-align: center;
  }
  .qt-print-title { font-weight: 800; font-size: 17px; color: var(--ink); margin-bottom: 6px; }
  .qt-print-text { font-size: 14px; color: var(--muted); max-width: 400px; margin: 0 auto 20px; }

  @media (max-width: 520px) {
    .qt-shell { padding: 40px 18px 70px; }
    .qt-row-2, .qt-row-3 { grid-template-columns: 1fr; }
    .qt-card, .qt-callout { padding: 18px 16px 20px; }
    .qt-btn { white-space: normal; text-align: center; padding: 0.85rem 1.6rem; }
  }

  @media print {
    #qt-intro, #qt-quiz, .qt-print-box, .qt-actions { display: none !important; }
    #qt-results { display: block !important; }
    .qt-card, .qt-callout { box-shadow: none; break-inside: avoid; page-break-inside: avoid; }
  }
  /* ---------- ajouts DA (classes propres a cette page, absentes du quiz corps) ---------- */
  .qt-callout-line {
    font-size: 13.5px;
    line-height: 1.7;
    color: var(--ink);
    margin-bottom: 4px;
  }
  .qt-callout-line:last-child { margin-bottom: 0; }
  .qt-callout-line strong { color: var(--blue); }
  .qt-callout .qt-field:last-of-type { margin-bottom: 0; }
</style>
</head>
<body>
<div class="qt-wrap">
  <div class="qt-shell">

    <!-- ============ INTRO ============ -->
    <div id="qt-intro" class="qt-screen">
      <span class="qt-eyebrow">Semaine 1 — Comprendre</span>
      <h1>Quiz - Mon rapport au <em>contrôle</em></h1>
      <p class="qt-intro-text">Ici, on regarde comment tu gères le stress et l'excitation.</p>
      <p class="qt-intro-text">Est-ce que t'as l'impression de subir, de contrôler, ou d'avoir des leviers pour jouer avec ce qui se passe.</p>
      <button id="qt-start-btn" class="qt-btn"><span>Commencer</span><span class="qt-arrow" aria-hidden="true">→</span></button>
    </div>

    <!-- ============ QUIZ ============ -->
    <div id="qt-quiz" class="qt-screen qt-hidden">
      <div class="qt-progress-label" id="qt-progress-label"></div>
      <div class="qt-progress-track"><div class="qt-progress-bar" id="qt-progress-bar"></div></div>
      <div id="qt-q-container"></div>
    </div>

    <!-- ============ RESULTS ============ -->
    <div id="qt-results" class="qt-screen qt-hidden">
      <div id="qt-results-container"></div>
    </div>

  </div>
</div>

<script>
(function () {

  var QUESTIONS = [
    {
      text: "Quand tu sens que l'éjaculation approche plus vite que tu ne voudrais :",
      opts: [
        { p: 1, t: "Je panique ou je me crispe, et je laisse faire." },
        { p: 2, t: "Je stresse, j'essaie vaguement de ralentir, mais sans vraie stratégie." },
        { p: 3, t: "J'ai 1 ou 2 techniques mais c'est pas encore automatique." },
        { p: 4, t: "J'utilise consciemment des stratégies (pauses, changements de position, respiration, focus sensations…) et je sens que ça change quelque chose." }
      ]
    },
    {
      text: "Dans un rapport sexuel, le fait de dire « on ralentit / on fait une pause / on change de rythme », pour toi c'est :",
      opts: [
        { p: 1, t: "Quasi inimaginable, j'ai l'impression que j'ai pas ce droit et que ça casse le moment." },
        { p: 2, t: "Très difficile, je pourrais le faire mais ça me mettrait mal à l'aise." },
        { p: 3, t: "Possible même si c'est pas encore hyper fluide." },
        { p: 4, t: "Assez naturel, j'arrive à ajuster le rythme avec l'autre sans trop de difficulté." }
      ]
    },
    {
      text: "Face aux situations qui te stressent (pénétration, sexe oral, nudité de l'autre, sexting, dirty talk…), tu fais plutôt :",
      opts: [
        { p: 1, t: "Je subis ou j'évite, mais j'ajuste rien." },
        { p: 2, t: "Je remarque le stress, mais je me force souvent à continuer comme si de rien n'était." },
        { p: 3, t: "J'essaie d'introduire quelques micro-solutions (humour, changer de position, respirer…)." },
        { p: 4, t: "J'ai un petit « kit perso » de solutions pour me réguler et adapter la situation." }
      ]
    },
    {
      text: "Globalement, pendant le sexe (solo ou à deux), tu te sens plutôt :",
      opts: [
        { p: 1, t: "En mode « je gère une bombe à retardement » / je subis." },
        { p: 2, t: "En tension entre envie de lâcher prise et besoin de tout contrôler." },
        { p: 3, t: "Parfois en contrôle, parfois dans le lâcher-prise, ça oscille." },
        { p: 4, t: "De plus en plus capable de lâcher prise tout en gardant des repères." }
      ]
    }
  ];

  var currentQ = 0;
  var score = 0;
  var answering = false;

  var elIntro = document.getElementById('qt-intro');
  var elQuiz = document.getElementById('qt-quiz');
  var elResults = document.getElementById('qt-results');

  document.getElementById('qt-start-btn').addEventListener('click', startQuiz);

  function startQuiz() {
    elIntro.classList.add('qt-hidden');
    elQuiz.classList.remove('qt-hidden');
    renderQuestion();
  }

  function renderQuestion() {
    var q = QUESTIONS[currentQ];
    var total = QUESTIONS.length;
    answering = false;
    document.getElementById('qt-progress-label').textContent = 'Question ' + (currentQ + 1) + ' / ' + total;
    document.getElementById('qt-progress-bar').style.width = (((currentQ + 1) / total) * 100) + '%';
    var container = document.getElementById('qt-q-container');
    var letters = ['A', 'B', 'C', 'D'];
    var html = '';
    html += '<p class="qt-q-text">' + q.text + '</p>';
    html += '<div class="qt-options">';
    q.opts.forEach(function (opt, i) {
      html += '<button class="qt-opt-btn" data-points="' + opt.p + '">'
        + '<span class="qt-opt-letter">' + letters[i] + '</span>'
        + '<span class="qt-opt-text">' + opt.t + '</span>'
        + '</button>';
    });
    html += '</div>';
    container.innerHTML = html;
    container.addEventListener('click', onOptionClick);
  }

  function onOptionClick(e) {
    var btn = e.target.closest('.qt-opt-btn');
    if (!btn || answering) return;
    answering = true;
    var container = document.getElementById('qt-q-container');
    container.removeEventListener('click', onOptionClick);
    container.querySelectorAll('.qt-opt-btn').forEach(function (b) { b.disabled = true; });
    btn.classList.add('qt-selected');
    score += parseInt(btn.dataset.points, 10);
    setTimeout(function () {
      currentQ++;
      if (currentQ < QUESTIONS.length) {
        renderQuestion();
      } else {
        showResults();
      }
    }, 350);
  }

  function getBand() {
    if (score <= 7) return 'a';
    if (score <= 11) return 'b';
    return 'c';
  }

  function chipGroup(name, options) {
    var html = '<div class="qt-chip-group" data-chip-group="' + name + '">';
    options.forEach(function (o) {
      html += '<button type="button" class="qt-chip" data-value="' + o + '">' + o + '</button>';
    });
    html += '</div><input type="text" class="qt-input qt-chip-other-input qt-hidden" placeholder="précise ici…" data-chip-other="' + name + '">';
    return html;
  }

  function cycleStressPointer(text) {
    var html = '<div class="qt-ex-label">Exercice 1</div>';
    html += '<p class="qt-ex-intro">' + text + '</p>';
    return html;
  }

  function tipsBlock() {
    return '<div class="qt-callout">'
      + '<div class="qt-callout-label">🌶️ Les petits tips</div>'
      + '<p class="qt-callout-line"><strong>Aides ponctuelles</strong> — tester des préservatifs à la lidocaïne pour diminuer la sensibilité et interrompre le cycle du stress.</p>'
      + '<p class="qt-callout-line"><strong>Éjaculation pré-rapport</strong> — éjaculer avant un rapport si ça correspond à tes envies et à ton contexte.</p>'
      + '<p class="qt-callout-line"><strong>Vérifier les causes médicales ou psychologiques</strong> — consulter un·e professionnel·le (andrologue, urologue…) pour écarter ou prendre en charge des facteurs physiologiques ou psychologiques : tabac, diabète, alcool, dépression, etc.</p>'
      + '<p class="qt-callout-line"><strong>Aides / accessoires pour l\'érection</strong> — tester éventuellement harnais, cock ring ou cock armor : ça peut aider à maintenir l\'afflux sanguin.</p>'
      + '</div>';
  }

  function showResults() {
    elQuiz.classList.add('qt-hidden');
    elResults.classList.remove('qt-hidden');
    var band = getBand();
    var container = document.getElementById('qt-results-container');
    var html = '';

    html += '<div class="qt-result-kicker">Ton résultat</div>';

    if (band === 'a') {
      html += '<h2 class="qt-result-title">Ton rapport au contrôle : <strong>« Je subis mon corps et ses réactions »</strong></h2>';
      html += '<p class="qt-result-desc">T\'as souvent l\'impression que ça t\'échappe : l\'éjaculation, le stress, le rythme du rapport.</p>';
      html += '<p class="qt-result-desc">Tu te crispes, tu paniques ou tu te forces à continuer, mais sans outils concrets pour casser le cycle du stress.</p>';
      html += '<hr class="qt-divider">';

      html += cycleStressPointer('Remplis le tableau « Cycle du stress » pour au moins 1 situation qui t\'excite le plus ou qui te fait le plus stresser. Note ce que tu ressens, puis réfléchis à une solution simple (par exemple : t\'arrêter pour respirer).');

      html += '<div class="qt-ex-label">Exercice 2</div>';
      html += '<p class="qt-ex-intro">Teste des positions avec le moins de tension musculaire possible dans le bassin, les cuisses ou les fessiers.</p>';
      html += '<div class="qt-card">'
        + '<div class="qt-field"><span class="qt-field-label">Position testée</span>' + chipGroup('a2-position', ['Partenaire sur le dessus', 'Levrette allongée', 'Autre']) + '</div>'
        + '</div>';

      html += '<div class="qt-callout">'
        + '<div class="qt-callout-label">🎯 Micro-défi de la semaine</div>'
        + '<p class="qt-ex-intro" style="margin-bottom:14px;">Choisis une stratégie très simple (par exemple une pause respiration de 10 secondes, ou un changement de position plus « cool ») et teste-la une fois, même brièvement.</p>'
        + '<div class="qt-field"><span class="qt-field-label">Ma stratégie testée</span>' + chipGroup('a-defi-strategie', ['Pause respiration de 10 secondes', 'Changement de position', 'Autre']) + '</div>'
        + '</div>';
    }

    if (band === 'b') {
      html += '<h2 class="qt-result-title">Ton rapport au contrôle : <strong>« J\'ai des débuts de stratégie »</strong></h2>';
      html += '<p class="qt-result-desc">Tu vois déjà quand le stress monte et tu as quelques idées pour gérer (changer de rythme, bouger, respirer), mais ce n\'est pas encore intégré.</p>';
      html += '<p class="qt-result-desc">Tu es entre subir et agir : parfois tu t\'ajustes, parfois tu t\'oublies et tu retombes dans l\'automatique.</p>';
      html += '<hr class="qt-divider">';

      html += cycleStressPointer('Remplis le tableau « Cycle du stress » pour 2 à 3 situations (baiser, masturbation mutuelle, nudité, pénétration, dirty talk…), et liste pour chacune 1 à 2 solutions possibles.');

      html += '<div class="qt-ex-label">Exercice 2</div>';
      html += '<p class="qt-ex-intro">Pratique des pauses conscientes et des changements de position avant d\'arriver à une tension musculaire trop forte.</p>';
      html += '<div class="qt-card">'
        + '<div class="qt-field"><span class="qt-field-label">Ce que je pratique</span>' + chipGroup('b2-pratique', ['Pause consciente', 'Changement de position']) + '</div>'
        + '</div>';

      html += '<div class="qt-callout">'
        + '<div class="qt-callout-label">🎯 Micro-défi contrôle de la semaine</div>'
        + '<p class="qt-ex-intro" style="margin-bottom:14px;">Dans un rapport ou une masturbation, décide à l\'avance que tu feras au moins une pause volontaire (au lieu d\'attendre que le stress soit au max) pour respirer et revenir aux sensations.</p>'
        + '<div class="qt-field"><span class="qt-field-label">Ma pause volontaire</span>' + chipGroup('b-defi-pause', ['Je l\'ai faite', 'Pas encore']) + '</div>'
        + '<div class="qt-field"><span class="qt-field-label">Ce que ça a changé</span><textarea class="qt-textarea"></textarea></div>'
        + '</div>';
    }

    if (band === 'c') {
      html += '<h2 class="qt-result-title">Ton rapport au contrôle : <strong>« Je peux jouer avec ce qui se passe »</strong></h2>';
      html += '<p class="qt-result-desc">Tu commences à te sentir aux commandes : tu repères ton stress, tu as des outils pour le réguler, tu oses parfois dire « on ralentit / on change ».</p>';
      html += '<p class="qt-result-desc">Tu peux désormais orienter ton travail non plus seulement sur gérer l\'urgence, mais sur affiner ton kit (positions, pauses, respiration, scénarios, masturbation sans but).</p>';
      html += '<hr class="qt-divider">';

      html += cycleStressPointer('Complète le tableau « Cycle du stress » avec des solutions variées pour chaque situation.');

      html += '<div class="qt-ex-label">Exercice 2</div>';
      html += '<p class="qt-ex-intro">Teste les conseils plus avancés si besoin, tout en continuant à explorer la masturbation sans but d\'éjaculation.</p>';
      html += '<div class="qt-card">'
        + '<div class="qt-field"><span class="qt-field-label">Ce que je teste</span>' + chipGroup('c2-teste', ['Préservatifs à la lidocaïne', 'Éjaculer avant un rapport', 'Masturbation sans but d\'éjaculation', 'Autre']) + '</div>'
        + '</div>';

      html += '<div class="qt-callout">'
        + '<div class="qt-callout-label">🎯 Micro-défi contrôle de la semaine</div>'
        + '<p class="qt-ex-intro" style="margin-bottom:14px;">Choisis une situation où tu te sens relativement en sécurité et amuse-toi à tester 2 ou 3 stratégies dans le même rapport (pause, changement de position, focus sur d\'autres zones…) juste pour voir comment ton corps répond.</p>'
        + '<div class="qt-field"><span class="qt-field-label">Stratégies testées</span>' + chipGroup('c-defi-strategies', ['Pause', 'Changement de position', 'Focus sur d\'autres zones', 'Autre']) + '</div>'
        + '</div>';
    }

    html += tipsBlock();

    html += '<div class="qt-print-box">'
      + '<div class="qt-print-title">Garde tes réponses</div>'
      + '<p class="qt-print-text">Imprime cette page ou garde-la en PDF pour retrouver tes réponses au fil du programme.</p>'
      + '<button type="button" class="qt-btn" id="qt-print-btn"><span>Imprimer / PDF</span><span class="qt-arrow" aria-hidden="true">→</span></button>'
      + '</div>';

    html += '<div class="qt-actions">'
      + '<button type="button" class="qt-btn qt-btn-outline" id="qt-retry-btn"><span>Recommencer le quiz</span><span class="qt-arrow" aria-hidden="true">↺</span></button>'
      + '</div>';

    container.innerHTML = html;
    container.addEventListener('click', onResultsClick);
    document.getElementById('qt-print-btn').addEventListener('click', function () { window.print(); });
    document.getElementById('qt-retry-btn').addEventListener('click', restartQuiz);
  }

  function onResultsClick(e) {
    var chip = e.target.closest('.qt-chip');
    if (!chip) return;
    var group = chip.closest('.qt-chip-group');
    var groupName = group.dataset.chipGroup;
    var wasActive = chip.classList.contains('qt-chip-active');
    group.querySelectorAll('.qt-chip').forEach(function (c) { c.classList.remove('qt-chip-active'); });
    var otherInput = group.parentNode.querySelector('[data-chip-other="' + groupName + '"]');
    if (!wasActive) {
      chip.classList.add('qt-chip-active');
      if (chip.dataset.value === 'Autre') {
        otherInput.classList.remove('qt-hidden');
        otherInput.focus();
      } else if (otherInput) {
        otherInput.classList.add('qt-hidden');
      }
    } else if (otherInput) {
      otherInput.classList.add('qt-hidden');
    }
  }

  function restartQuiz() {
    currentQ = 0;
    score = 0;
    elResults.classList.add('qt-hidden');
    elIntro.classList.remove('qt-hidden');
  }

})();
</script>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz - Ma map sexuelle — Programme C.O.M.E.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    --blue: #2F6FE4;
    --blue-soft: rgba(47,111,228,0.18);
    --blue-line: rgba(47,111,228,0.4);
    --blue-faint: rgba(47,111,228,0.06);
    --yellow: #F7FF59;
    --yellow-soft: rgba(247,255,89,0.35);
    --ink: #1c1c1c;
    --muted: #5b6273;
    font-family: 'Raleway', Arial, sans-serif;
    color: var(--ink);
    background: #fff;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  a, button { cursor: pointer; font-family: inherit; }
  :focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
  .qt-wrap { min-height: 100vh; }
  .qt-shell { max-width: 640px; margin: 0 auto; padding: 56px 24px 70px; }
  .qt-hidden { display: none !important; }

  .qt-eyebrow {
    display: inline-block;
    color: var(--blue);
    border: 1px solid var(--blue-soft);
    border-radius: 999px;
    padding: 5px 14px;
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 22px;
  }

  /* ---------- CTA façon Mimétique ---------- */
  .qt-btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    overflow: hidden;
    background: var(--yellow);
    color: var(--blue);
    font-weight: 700;
    font-size: 0.95rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    white-space: nowrap;
    padding: 0.85rem 2.2rem;
    border: 1.5px solid var(--blue);
    border-radius: 10rem;
    transition: color 450ms ease;
    -webkit-tap-highlight-color: transparent;
  }
  .qt-btn::before {
    content: '';
    position: absolute;
    left: 0; right: 0; bottom: 0;
    top: 102%;
    background: var(--blue);
    transition: top 450ms ease;
    z-index: 0;
  }
  .qt-btn span { position: relative; z-index: 1; }
  .qt-btn .qt-arrow { display: inline-block; transition: transform 450ms ease; }
  .qt-btn:hover { color: var(--yellow); }
  .qt-btn:hover::before { top: 0; }
  .qt-btn:hover .qt-arrow { transform: translateX(5px); }
  .qt-btn:disabled { opacity: 0.4; pointer-events: none; }
  .qt-btn-outline { background: #fff; color: var(--blue); }
  .qt-btn-outline::before { background: var(--blue); }
  .qt-btn-outline:hover { color: var(--yellow); }

  @media (prefers-reduced-motion: reduce) {
    .qt-btn, .qt-btn::before, .qt-btn .qt-arrow, .qt-progress-bar { transition: none; }
    .qt-screen { animation: none; }
  }

  .qt-screen { animation: qtFadeUp 0.45s ease both; }
  @keyframes qtFadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .qt-shell h1 {
    font-size: clamp(30px, 6vw, 44px);
    font-weight: 800;
    line-height: 1.1;
    letter-spacing: -0.015em;
    margin-bottom: 20px;
  }
  .qt-shell h1 em {
    font-style: normal;
    color: var(--blue);
    background: linear-gradient(transparent 62%, var(--yellow) 62%);
    padding: 0 4px;
  }
  .qt-intro-text { font-size: 16px; color: var(--muted); max-width: 480px; margin-bottom: 12px; }
  #qt-intro .qt-btn { margin-top: 24px; }

  /* ---------- quiz ---------- */
  .qt-progress-label {
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
    text-align: right;
  }
  .qt-progress-track { height: 4px; background: var(--blue-soft); border-radius: 4px; overflow: hidden; margin-bottom: 36px; }
  .qt-progress-bar { height: 100%; background: var(--blue); border-radius: 4px; transition: width 350ms ease; width: 0%; }

  .qt-axis-name {
    display: inline-block;
    background: var(--blue);
    color: #fff;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    padding: 5px 13px;
    border-radius: 100px;
    margin-bottom: 14px;
  }
  .qt-q-text {
    font-weight: 700;
    font-size: clamp(20px, 3.2vw, 25px);
    line-height: 1.3;
    color: var(--blue);
    margin-bottom: 44px;
  }

  /* ---------- curseur ---------- */
  .qt-slider-box { padding: 0 2px; }
  .qt-slider {
    --p: 0.444;
    position: relative;
    height: 74px;
    margin-top: 6px;
  }
  .qt-track {
    position: absolute; left: 0; right: 0; top: 34px;
    height: 8px; border-radius: 8px;
    background: var(--blue-soft);
  }
  .qt-track-fill {
    position: absolute; left: 0; top: 0; bottom: 0;
    width: calc(15px + (100% - 30px) * var(--p));
    background: var(--blue);
    border-radius: 8px;
  }
  .qt-slider.qt-untouched .qt-track-fill { background: var(--blue-line); }
  .qt-range {
    -webkit-appearance: none; appearance: none;
    position: absolute; left: 0; right: 0; top: 20px;
    width: 100%; height: 36px;
    background: transparent;
    margin: 0;
    touch-action: pan-y;
  }
  .qt-range::-webkit-slider-runnable-track { -webkit-appearance: none; height: 36px; background: transparent; border: none; }
  .qt-range::-moz-range-track { height: 36px; background: transparent; border: none; }
  .qt-range::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 30px; height: 30px; border-radius: 50%;
    background: var(--yellow);
    border: 2.5px solid var(--blue);
    box-shadow: 0 0 0 5px var(--blue-faint), 0 3px 10px rgba(47,111,228,0.3);
    margin-top: 3px;
    cursor: grab;
  }
  .qt-range::-moz-range-thumb {
    width: 25px; height: 25px; border-radius: 50%;
    background: var(--yellow);
    border: 2.5px solid var(--blue);
    box-shadow: 0 0 0 5px var(--blue-faint), 0 3px 10px rgba(47,111,228,0.3);
    cursor: grab;
  }
  .qt-slider.qt-untouched .qt-range::-webkit-slider-thumb { background: #fff; border-style: dashed; }
  .qt-slider.qt-untouched .qt-range::-moz-range-thumb { background: #fff; border-style: dashed; }
  .qt-range:focus-visible { outline: none; }
  .qt-range:focus-visible::-webkit-slider-thumb { outline: 2px solid var(--blue); outline-offset: 3px; }
  .qt-range:focus-visible::-moz-range-thumb { outline: 2px solid var(--blue); outline-offset: 3px; }

  .qt-bubble {
    position: absolute; top: -4px;
    left: calc(15px + (100% - 30px) * var(--p));
    transform: translateX(-50%);
    min-width: 34px; height: 30px; padding: 0 9px;
    display: flex; align-items: center; justify-content: center;
    background: var(--blue); color: #fff;
    font-weight: 800; font-size: 14px;
    border-radius: 9px;
    pointer-events: none;
  }
  .qt-bubble::after {
    content: ''; position: absolute; left: 50%; bottom: -5px; margin-left: -5px;
    border: 5px solid transparent; border-top-color: var(--blue); border-bottom: 0;
  }
  .qt-slider.qt-untouched .qt-bubble { background: #fff; color: var(--blue); border: 1.5px dashed var(--blue); font-weight: 700; font-size: 12px; white-space: nowrap; }
  .qt-slider.qt-untouched .qt-bubble::after { display: none; }
  .qt-ticks { position: relative; height: 18px; margin-top: -6px; }
  .qt-tick {
    position: absolute; top: 0;
    left: calc(15px + (100% - 30px) * var(--t));
    transform: translateX(-50%);
    font-size: 11.5px; font-weight: 600; color: var(--muted);
  }
  .qt-tick.qt-tick-on { color: var(--blue); font-weight: 800; }

  .qt-extremes { display: flex; justify-content: space-between; gap: 22px; margin-top: 20px; }
  .qt-extreme {
    flex: 1 1 0; min-width: 0;
    font-size: 13.5px; line-height: 1.45; color: var(--muted);
    border-top: 2px solid var(--blue-soft);
    padding-top: 10px;
    transition: color 180ms ease, border-color 180ms ease;
  }
  .qt-extreme strong { display: block; font-size: 10.5px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--blue); margin-bottom: 4px; }
  .qt-extreme-right { text-align: right; }
  .qt-extreme, .qt-q-text, .qt-result-desc { text-wrap: balance; }
  .qt-extreme.qt-extreme-on { color: var(--ink); border-top-color: var(--blue); }

  .qt-nav { display: flex; justify-content: space-between; align-items: center; margin-top: 40px; gap: 12px; flex-wrap: wrap; }
  .qt-nav-left { display: flex; align-items: center; gap: 16px; }
  .qt-btn-text { background: none; border: none; color: var(--muted); font-size: 13.5px; font-family: inherit; padding: 8px 4px; }
  .qt-btn-text:hover { color: var(--blue); }
  .qt-hint { font-size: 12.5px; color: var(--muted); min-height: 20px; margin-top: 14px; text-align: center; }

  /* ---------- résultats ---------- */
  .qt-result-kicker { font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; }
  .qt-result-title { font-weight: 800; font-size: clamp(26px, 4.6vw, 34px); color: var(--blue); line-height: 1.15; margin-bottom: 16px; }
  .qt-result-desc { font-size: 15.5px; color: var(--muted); margin-bottom: 12px; }
  .qt-result-desc strong { color: var(--ink); }

  .qt-radar-card {
    background: #fff;
    border: 1.5px solid var(--blue);
    border-radius: 22px;
    padding: 14px 8px 12px;
    margin: 26px 0 8px;
    box-shadow: 0 0 0 6px var(--blue-faint), 0 10px 28px rgba(47,111,228,0.12);
  }
  .qt-radar { width: 100%; }
  .qt-radar svg { display: block; margin: 0 auto; max-width: 100%; height: auto; overflow: visible; }
  .qt-radar-note { font-size: 12px; color: var(--muted); text-align: center; margin: 4px 14px 4px; }

  .qt-divider { border: none; border-top: 1.5px solid var(--blue-soft); margin: 32px 0; }
  .qt-section-title { font-weight: 800; font-size: 18px; color: var(--ink); margin-bottom: 6px; }
  .qt-section-sub { font-size: 14px; color: var(--muted); margin-bottom: 20px; }

  .qt-card {
    background: #fff;
    border: 1.5px solid var(--blue-soft);
    border-radius: 20px;
    padding: 20px 20px 22px;
    margin-bottom: 16px;
    break-inside: avoid; page-break-inside: avoid;
  }
  .qt-card-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .qt-card-num {
    flex: 0 0 30px; width: 30px; height: 30px; border-radius: 50%;
    background: var(--blue); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 13px;
  }
  .qt-card-name { flex: 1; min-width: 0; font-weight: 800; font-size: 15.5px; color: var(--blue); line-height: 1.3; }
  .qt-card-score {
    flex: 0 0 auto;
    background: var(--yellow); color: var(--blue);
    border: 1.5px solid var(--blue);
    border-radius: 999px;
    padding: 3px 12px;
    font-size: 13px; font-weight: 800; white-space: nowrap;
  }
  .qt-card-score small { font-size: 10.5px; font-weight: 600; opacity: 0.8; }
  .qt-read {
    background: var(--blue-faint);
    border-radius: 12px;
    padding: 11px 14px;
    margin-bottom: 16px;
    font-size: 13px; line-height: 1.5; color: var(--muted);
  }
  .qt-read b { color: var(--blue); font-weight: 800; }
  .qt-read .qt-read-go { display: block; margin-top: 3px; }
  .qt-label {
    display: block;
    font-size: 11px; font-weight: 800; letter-spacing: 1.1px; text-transform: uppercase;
    color: var(--blue);
    margin-bottom: 6px;
  }
  .qt-story { font-size: 14.5px; color: var(--ink); margin-bottom: 16px; text-wrap: pretty; }
  .qt-exo {
    background: var(--yellow-soft);
    border: 1px solid rgba(47,111,228,0.25);
    border-radius: 14px;
    padding: 14px 16px;
  }
  .qt-exo p { font-size: 14.5px; color: var(--ink); text-wrap: pretty; }


  /* ---------- tableau de lecture ---------- */
  .qt-table-wrap {
    border: 1.5px solid var(--blue);
    border-radius: 18px;
    overflow: hidden;
    margin: 26px 0 0;
    box-shadow: 0 0 0 6px var(--blue-faint), 0 10px 28px rgba(47,111,228,0.12);
  }
  .qt-table { table-layout: fixed; border-collapse: collapse; width: 100%; background: #fff; }
  .qt-table th {
    background: var(--blue-faint); color: var(--blue);
    font-size: 11.5px; font-weight: 700; text-align: left; vertical-align: top;
    padding: 10px 10px; border-bottom: 1.5px solid var(--blue); border-right: 1px solid var(--blue-line);
  }
  .qt-table td {
    padding: 12px 10px; font-size: 13px; line-height: 1.5; vertical-align: top;
    border-bottom: 1px solid var(--blue-line); border-right: 1px solid var(--blue-line);
    -webkit-hyphens: auto; hyphens: auto; text-wrap: pretty;
  }
  .qt-table th:last-child, .qt-table td:last-child { border-right: none; }
  .qt-table tbody tr:last-child td { border-bottom: none; }
  .qt-table td.qt-score-cell { font-weight: 800; color: var(--blue); white-space: nowrap; }

  /* ---------- encadré priorités ---------- */
  .qt-prio {
    background: var(--yellow-soft);
    border: 1.5px solid var(--blue);
    border-radius: 18px;
    padding: 18px 20px 20px;
    margin-top: 22px;
  }
  .qt-prio-title { font-weight: 800; font-size: 11.5px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--blue); margin-bottom: 12px; }
  .qt-prio-list { display: flex; flex-wrap: wrap; gap: 8px; }
  .qt-prio-chip {
    background: var(--yellow); color: var(--blue);
    border: 1.5px solid var(--blue); border-radius: 999px;
    padding: 7px 15px; font-size: 13px; font-weight: 700; line-height: 1.3;
    transition: background 150ms ease, color 150ms ease;
  }
  .qt-prio-chip:hover { background: var(--blue); color: var(--yellow); }
  .qt-prio-chip small { font-weight: 600; opacity: 0.75; margin-left: 4px; }
  .qt-prio-note { font-size: 13px; color: var(--muted); margin-top: 12px; text-wrap: pretty; }

  /* ---------- exercices en toggles ---------- */
  .qt-accordion-list { display: flex; flex-direction: column; gap: 12px; }
  .qt-accordion { border: 1.5px solid var(--blue-soft); border-radius: 16px; overflow: hidden; background: #fff; transition: border-color 150ms ease; }
  .qt-accordion.qt-accordion-open { border-color: var(--blue); }
  .qt-accordion-header {
    display: flex; align-items: center; gap: 12px; width: 100%;
    background: #fff; border: none; padding: 14px 16px; text-align: left;
    font-family: inherit; font-size: 14.5px; font-weight: 700; color: var(--ink);
  }
  .qt-accordion-header:hover { background: var(--blue-faint); }
  .qt-accordion-header .qt-card-num { flex: 0 0 28px; width: 28px; height: 28px; font-size: 12.5px; }
  .qt-accordion-title { flex: 1; min-width: 0; line-height: 1.3; }
  .qt-accordion-title em { display: block; font-style: normal; font-size: 10.5px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; color: var(--blue); margin-top: 2px; }
  .qt-accordion-chevron { color: var(--blue); flex-shrink: 0; font-size: 13px; transition: transform 200ms ease; }
  .qt-accordion.qt-accordion-open .qt-accordion-chevron { transform: rotate(180deg); }
  .qt-accordion-panel { display: none; padding: 18px 16px 20px; border-top: 1px solid var(--blue-soft); }
  .qt-accordion.qt-accordion-open .qt-accordion-panel { display: block; }

  .qt-closing { font-size: 15px; color: var(--ink); margin-top: 26px; }
  .qt-closing strong { color: var(--blue); }

  .qt-print-box {
    background: #fff;
    border: 1.5px solid var(--blue);
    border-radius: 22px;
    padding: 26px 24px;
    margin-top: 34px;
    text-align: center;
    box-shadow: 0 0 0 6px var(--blue-faint), 0 10px 28px rgba(47,111,228,0.12);
  }
  .qt-print-title { font-size: 11px; font-weight: 800; letter-spacing: 1.8px; text-transform: uppercase; color: var(--blue); margin-bottom: 8px; }
  .qt-print-text { font-size: 14px; color: var(--muted); max-width: 380px; margin: 0 auto 16px; }
  .qt-actions { display: flex; flex-direction: column; align-items: center; gap: 12px; margin-top: 30px; }

  @media (max-width: 520px) {
    .qt-shell { padding: 40px 18px 56px; }
    .qt-card { padding: 18px 16px 20px; }
    .qt-extreme { font-size: 12.5px; }
    .qt-card-head { flex-wrap: wrap; }
    .qt-card-score { margin-left: 42px; }
    .qt-table th { font-size: 10.5px; padding: 8px 6px; }
    .qt-table td { font-size: 11.5px; padding: 9px 6px; }
    .qt-accordion-header { padding: 13px 13px; font-size: 14px; }
    .qt-accordion-panel { padding: 16px 13px 18px; }
  }

  @media print {
    body { background: #fff; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    #qt-intro, #qt-quiz, .qt-print-box, .qt-actions { display: none !important; }
    #qt-results { display: block !important; }
    .qt-screen { animation: none; }
    .qt-shell { padding-top: 16px; }
    .qt-radar-card { break-inside: avoid; page-break-inside: avoid; }
    .qt-accordion { break-inside: avoid; page-break-inside: avoid; border-color: var(--blue-soft); }
    .qt-accordion-panel { display: block !important; }
    .qt-accordion-chevron { display: none !important; }
    .qt-prio-chip { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
<style id="qt-noscroll">
  /* Pas de barre de défilement interne : dans l'iframe Kajabi, c'est la page parente qui défile */
  html.qt-embedded, html.qt-embedded body { overflow: hidden !important; }
  html.qt-embedded .qt-wrap { min-height: 0 !important; }
  textarea { overflow: hidden !important; }
</style>

<body>
<div class="qt-wrap">
  <div class="qt-shell">

    <!-- ============ INTRO ============ -->
    <div id="qt-intro" class="qt-screen">
      <span class="qt-eyebrow">Semaine 2 — Redéfinir</span>
      <h1>Ma map <em>sexuelle</em></h1>
      <p class="qt-intro-text">Déplace les curseurs selon ce qui te ressemble le plus pour établir ta map sexuelle et découvrir des exercices qui te correspondent.</p>
      <p class="qt-intro-text">7 questions, pas de bonne ou de mauvaise réponse : place le curseur de 1 à 10, là où tu te reconnais aujourd’hui.</p>
      <button id="qt-start-btn" class="qt-btn" type="button"><span>Commencer</span><span class="qt-arrow">→</span></button>
    </div>

    <!-- ============ QUIZ ============ -->
    <div id="qt-quiz" class="qt-screen qt-hidden">
      <div class="qt-progress-label" id="qt-progress-label"></div>
      <div class="qt-progress-track"><div class="qt-progress-bar" id="qt-progress-bar"></div></div>
      <div id="qt-q-container"></div>
    </div>

    <!-- ============ RESULTS ============ -->
    <div id="qt-results" class="qt-screen qt-hidden">
      <div id="qt-results-container"></div>
    </div>

  </div>
</div>

<script>
(function () {

  /* ------------------------------------------------------------------
     Contenu : 7 axes. Pour chaque axe, un texte par zone de score
     (low = 1–3, mid = 4–7, high = 8–10). Seule la zone correspondant
     au placement du curseur est affichée.
     ------------------------------------------------------------------ */
  var AXES = [
    {
      name: 'Place de la pénétration',
      lines: ['Place de la', 'pénétration'],
      short: 'Pénétration',
      q: 'Dans ta définition d’un rapport sexuel réussi, la pénétration (vagin, anus, bouche) compte :',
      left: 'Très peu / c’est juste une possibilité parmi d’autres',
      right: 'Énormément / c’est quasiment ce qui définit un rapport',
      low: {
        story: 'La pénétration c’est un des plats du buffet à volonté du sexe, tu sais déjà construire du plaisir sans elle. C’est une force si cela correspond à ton envie, pas une obligation de “réintroduire” la pénétration.',
        exo: 'Écrire ton scénario idéal de rapport, éjaculation incluse ou non, et regarder si la pénétration y a une place choisie. Si tu en as envie : explorer une pénétration lente, sans objectif de performance, en observant les sensations et les positions qui créent le moins de tension.'
      },
      mid: {
        story: 'La pénétration compte, mais elle n’est pas forcément tout le rapport. Tu peux consolider cette souplesse.',
        exo: 'Tester un rapport où la pénétration arrive plus tard, change de rythme, ou n’est qu’une séquence parmi d’autres. Après l’éjaculation, choisir consciemment une autre forme de plaisir plutôt que déclarer automatiquement la fin du moment.'
      },
      high: {
        story: 'La pénétration porte probablement beaucoup de poids : validation, performance, idée d’un “vrai” rapport, peur qu’elle s’arrête trop vite.',
        exo: 'Écrire de manière très détaillée “tout ce qu’un rapport peut être en dehors de la pénétration” : les actes, les sensations, les rôles de chacun·e…'
      }
    },
    {
      name: 'Importance de l’éjaculation',
      lines: ['Importance de', 'l’éjaculation'],
      short: 'Éjaculation',
      q: 'Pour toi, le fait d’éjaculer au “bon” moment ou comme prévu dans un rapport compte :',
      left: 'Peu / c’est pas central pour dire si c’est réussi',
      right: 'Beaucoup / ça définit presque à lui seul si c’est réussi ou non',

    // axes

      var e = pt(k, 1);
      s += '<line x1="' + cx.toFixed(1) + '" y1="' + cy.toFixed(1) + '" x2="' + e[0].toFixed(1) + '" y2="' + e[1].toFixed(1) + '" stroke="#2F6FE4" stroke-opacity="0.25" stroke-width="1"/>';

    for (k = 0; k < N; k++) {

      });
      s += '</text>';
    }

    // points + scores
    var rad = wide ? 12 : 9.5;
    for (k = 0; k < N; k++) {
      var p2 = pt(k, f(state.values[k]));
      s += '<circle cx="' + p2[0].toFixed(1) + '" cy="' + p2[1].toFixed(1) + '" r="' + rad + '" fill="#F7FF59" stroke="#2F6FE4" stroke-width="2"/>';

    }
    s += '</svg>';
    return s;
  }

  /* Axes prioritaires : ceux dont la zone « chargée » ressort le plus.
     Axes 1 et 2 (pénétration, éjaculation) : un score élevé = beaucoup de poids.
     Axes 3 à 7 : un score bas = axe peu présent. Tous les axes concernés sont listés (tension >= 7). */
  function priorities() {
    var arr = AXES.map(function (a, k) {
      var v = state.values[k];
      return { k: k, t: k < 2 ? v : 11 - v };
    }).filter(function (x) { return x.t >= 7; });
    arr.sort(function (a, b) { return b.t - a.t || a.k - b.k; });
    return arr.map(function (x) { return x.k; });
  }

      + '<div class="qt-print-title">Garde ta map</div>'
      + '<p class="qt-print-text">Imprime cette page ou garde-la en PDF pour retrouver ta map et tes exercices au fil du programme.</p>'
      + '<button type="button" class="qt-btn" id="qt-print-btn"><span>Imprimer ma map / PDF</span></button>'
      + '</div>';

    html += '<div class="qt-actions">'
      + '<button type="button" class="qt-btn qt-btn-outline" id="qt-edit-btn"><span>Modifier mes curseurs</span></button>'
      + '<button type="button" class="qt-btn-text" id="qt-retry-btn">↺ Recommencer</button>'
      + '</div>';

    document.getElementById('qt-results-container').innerHTML = html;
    drawRadar();
    window.scrollTo(0, 0);
    document.querySelectorAll('.qt-accordion-header').forEach(function (h) {
      h.addEventListener('click', function () {
        var acc = h.parentNode;
        var open = acc.classList.toggle('qt-accordion-open');
        h.setAttribute('aria-expanded', open ? 'true' : 'false');
      });
    });
    document.querySelectorAll('.qt-prio-chip').forEach(function (c) {
      c.addEventListener('click', function () {
        var acc = document.getElementById('qt-acc-' + c.dataset.axis);
        acc.classList.add('qt-accordion-open');
        acc.querySelector('.qt-accordion-header').setAttribute('aria-expanded', 'true');
        acc.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
    });
    document.getElementById('qt-print-btn').addEventListener('click', function () { window.print(); });
    document.getElementById('qt-edit-btn').addEventListener('click', function () {
      state.index = 0;
      elResults.classList.add('qt-hidden');
      elQuiz.classList.remove('qt-hidden');
      renderQuestion();
    });
    document.getElementById('qt-retry-btn').addEventListener('click', function () {
      resetState();
      elResults.classList.add('qt-hidden');
      elIntro.classList.remove('qt-hidden');
    });
  }

  var rt;
  window.addEventListener('resize', function () {
    clearTimeout(rt);
    rt = setTimeout(function () { if (!elResults.classList.contains('qt-hidden')) drawRadar(); }, 120);
  });

  /* ---------------- auto-hauteur (iframe Kajabi) ---------------- */
  (function () {
    function post() {
      try {
        window.parent.postMessage({ type: 'come-quiz-height', height: Math.ceil(document.body.getBoundingClientRect().height) }, '*');
      } catch (e) {}
    }
    window.addEventListener('load', post);
    window.addEventListener('resize', post);
    if (window.ResizeObserver) { new ResizeObserver(post).observe(document.body); }
    else { setInterval(post, 600); }
  })();

})();
</script>
<script id="qt-textarea-fit">
/* Champs texte : la case grandit avec le texte, jamais de barre de défilement interne */
(function(){
  function fit(t){ if(!t.getClientRects().length) return; if(t.scrollHeight>t.clientHeight+1){t.style.height=(t.scrollHeight+2)+'px';} }
  function fitAll(){ document.querySelectorAll('textarea').forEach(fit); }
  document.addEventListener('input',function(e){ if(e.target&&e.target.tagName==='TEXTAREA') fit(e.target); });
  window.addEventListener('resize',fitAll); window.addEventListener('load',fitAll);
  if(window.MutationObserver) new MutationObserver(fitAll).observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['class']});
  fitAll();
})();
</script>

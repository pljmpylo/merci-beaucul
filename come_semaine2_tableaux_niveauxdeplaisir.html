<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mes niveaux de plaisir — Programme C.O.M.E.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    --blue: #2F6FE4;
    --blue-soft: rgba(47,111,228,0.18);
    --blue-line: rgba(47,111,228,0.4);
    --blue-faint: rgba(47,111,228,0.06);
    --yellow: #F7FF59;
    --ink: #1c1c1c;
    --muted: #5b6273;
    font-family: 'Raleway', Arial, sans-serif;
    color: var(--ink);
    background: #fff;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  a, button { cursor: pointer; font-family: inherit; }
  :focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
  .qt-wrap { min-height: 100vh; }
  .qt-shell { max-width: 640px; margin: 0 auto; padding: 56px 24px 70px; }
  .qt-hidden { display: none !important; }

  .qt-eyebrow {
    display: inline-block;
    color: var(--blue);
    border: 1px solid var(--blue-soft);
    border-radius: 999px;
    padding: 5px 14px;
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 22px;
  }

  /* ---------- CTA façon Mimétique ---------- */
  .qt-btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    overflow: hidden;
    background: var(--yellow);
    color: var(--blue);
    font-weight: 700;
    font-size: 0.95rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    white-space: nowrap;
    padding: 0.85rem 2.2rem;
    border: 1.5px solid var(--blue);
    border-radius: 10rem;
    transition: color 450ms ease;
    -webkit-tap-highlight-color: transparent;
  }
  .qt-btn::before {
    content: '';
    position: absolute;
    left: 0; right: 0; bottom: 0;
    top: 102%;
    background: var(--blue);
    transition: top 450ms ease;
    z-index: 0;
  }
  .qt-btn span { position: relative; z-index: 1; }
  .qt-btn .qt-arrow { display: inline-block; transition: transform 450ms ease; }
  .qt-btn:hover { color: var(--yellow); }
  .qt-btn:hover::before { top: 0; }
  .qt-btn:hover .qt-arrow { transform: translateX(5px); }
  .qt-btn:disabled { opacity: 0.4; pointer-events: none; }
  .qt-btn-outline { background: #fff; color: var(--blue); }
  .qt-btn-outline::before { background: var(--blue); }
  .qt-btn-outline:hover { color: var(--yellow); }

  @media (prefers-reduced-motion: reduce) {
    .qt-btn, .qt-btn::before, .qt-btn .qt-arrow, .qt-progress-bar { transition: none; }
    .qt-screen { animation: none; }
  }

  .qt-screen { animation: qtFadeUp 0.45s ease both; }
  @keyframes qtFadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .qt-shell h1 {
    font-size: clamp(26px, 5vw, 34px);
    font-weight: 800;
    line-height: 1.18;
    letter-spacing: -0.015em;
    margin-bottom: 14px;
  }
  .qt-shell h1 em {
    font-style: normal;
    color: var(--blue);
    background: linear-gradient(transparent 62%, var(--yellow) 62%);
    padding: 0 4px;
  }
  .qt-intro-text { font-size: 15.5px; color: var(--muted); max-width: 480px; margin-bottom: 10px; }

  /* ---------- tableaux en toggles (façon Notion) ---------- */
  .qt-accordion-list { margin-top: 30px; display: flex; flex-direction: column; gap: 12px; }
  .qt-accordion {
    border: 1.5px solid var(--blue-soft);
    border-radius: 16px;
    overflow: hidden;
    background: #fff;
    transition: border-color 150ms ease;
  }
  .qt-accordion.qt-accordion-open { border-color: var(--blue); }
  .qt-accordion-header {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    width: 100%;
    background: #fff;
    border: none;
    padding: 15px 17px;
    font-family: inherit;
    font-size: 14.5px;
    font-weight: 700;
    color: var(--ink);
    text-align: left;
  }
  .qt-accordion-header:hover { background: var(--blue-faint); }
  .qt-accordion-header .qt-jump-num { color: var(--blue); font-weight: 800; margin-right: 10px; }
  .qt-accordion-chevron { color: var(--blue); flex-shrink: 0; font-size: 13px; transition: transform 200ms ease; }
  .qt-accordion.qt-accordion-open .qt-accordion-chevron { transform: rotate(180deg); }
  .qt-accordion-panel { display: none; padding: 2px 17px 20px; border-top: 1px solid var(--blue-soft); }
  .qt-accordion.qt-accordion-open .qt-accordion-panel { display: block; }
  .qt-accordion-panel .qt-intro-text { margin-top: 16px; }
  .qt-accordion-panel .qt-table-wrap { margin-top: 14px; }

  /* ---------- cards (une par ligne de tableau) ---------- */
  .qt-card {
    background: #fff;
    border: 1.5px solid var(--blue);
    border-radius: 20px;
    padding: 20px 20px 22px;
    margin-bottom: 18px;
    box-shadow: 0 0 0 6px var(--blue-faint), 0 10px 28px rgba(47,111,228,0.12);
  }
  .qt-card-name { font-weight: 800; font-size: 15px; color: var(--blue); margin-bottom: 14px; }

  .qt-field { margin-bottom: 14px; }
  .qt-field:last-child { margin-bottom: 0; }
  .qt-field-label {
    display: block;
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 7px;
  }
  .qt-input, .qt-textarea {
    width: 100%;
    border: 1.5px solid var(--blue-soft);
    border-radius: 12px;
    background: #fff;
    font-family: 'Raleway', sans-serif;
    font-size: 14.5px;
    color: var(--ink);
    padding: 10px 13px;
    transition: border-color 180ms ease;
  }
  .qt-input::placeholder, .qt-textarea::placeholder { color: #9aa1b0; font-style: italic; }
  .qt-input:focus, .qt-textarea:focus { outline: none; border-color: var(--blue); }
  .qt-textarea { resize: vertical; min-height: 64px; }

  /* ---------- chips à cocher (une seule sélection par groupe, empilées) ---------- */
  .qt-pick-group { display: flex; flex-direction: column; gap: 6px; width: 100%; }
  .qt-pick {
    display: block;
    width: 100%;
    background: #fff;
    border: 1.5px solid var(--blue-soft);
    border-radius: 10px;
    padding: 7px 8px;
    font-size: 12px;
    font-weight: 600;
    line-height: 1.25;
    color: var(--ink);
    font-family: inherit;
    text-align: center;
    white-space: normal;
    word-break: normal;
    -webkit-hyphens: auto;
    hyphens: auto;
    transition: border-color 150ms ease, background 150ms ease, color 150ms ease;
  }
  .qt-pick:hover { border-color: var(--blue); color: var(--blue); }
  .qt-pick.qt-pick-active { background: var(--yellow); border-color: var(--blue); color: var(--blue); }

  .qt-divider { border: none; border-top: 1.5px solid var(--blue-soft); margin: 30px 0; }

  /* ---------- tableau (reprend la structure de la page Notion, sans défilement) ---------- */
  .qt-table-wrap {
    border: 1.5px solid var(--blue);
    border-radius: 18px;
    margin-bottom: 10px;
    overflow: hidden;
    box-shadow: 0 0 0 6px var(--blue-faint), 0 10px 28px rgba(47,111,228,0.12);
  }
  .qt-table { table-layout: fixed; border-collapse: collapse; width: 100%; background: #fff; }
  .qt-table th {
    background: var(--blue-faint);
    color: var(--blue);
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 0;
    text-align: left;
    vertical-align: top;
    padding: 10px 8px;
    border-bottom: 1.5px solid var(--blue);
    border-right: 1px solid var(--blue-line);
    word-break: normal;
    overflow-wrap: normal;
    -webkit-hyphens: auto;
    hyphens: auto;
  }
  .qt-table th:last-child { border-right: none; }
  .qt-table td { padding: 10px 8px; border-bottom: 1px solid var(--blue-line); border-right: 1px solid var(--blue-line); vertical-align: top; word-break: normal; overflow-wrap: normal; }
  .qt-table td:last-child { border-right: none; }
  .qt-table tbody tr:last-child td { border-bottom: none; }
  .qt-table td.qt-table-rowlabel { font-weight: 700; font-size: 12.5px; color: var(--ink); -webkit-hyphens: auto; hyphens: auto; }
  .qt-table .qt-input, .qt-table .qt-textarea {
    width: 100%;
    font-size: 12.5px;
    padding: 4px 2px;
    border: none;
    border-radius: 0;
    background: transparent;
    border-bottom: 1px solid var(--blue-soft);
  }
  .qt-table .qt-input:focus, .qt-table .qt-textarea:focus { border-bottom-color: var(--blue); }
  .qt-table .qt-textarea { min-height: 70px; }

  .qt-tip { font-size: 13px; color: var(--muted); background: var(--blue-faint); border: 1px solid var(--blue-soft); border-radius: 12px; padding: 11px 15px; margin: 4px 0 4px; max-width: 480px; }

  @media (max-width: 460px) {
    .qt-table th { font-size: 10.5px; padding: 8px 6px; }
    .qt-table td { padding: 8px 6px; }
    .qt-table .qt-input, .qt-table .qt-textarea { font-size: 11.5px; padding: 6px 6px; }
    .qt-table td.qt-table-rowlabel { font-size: 11.5px; }
    .qt-pick { font-size: 10.5px; padding: 6px 5px; }
  }

  /* ---------- nav ---------- */
  .qt-nav { display: flex; justify-content: space-between; align-items: center; margin-top: 30px; gap: 12px; flex-wrap: wrap; }
  .qt-nav-left { display: flex; align-items: center; gap: 16px; }
  .qt-btn-text { background: none; border: none; color: var(--muted); font-size: 13.5px; font-family: inherit; padding: 8px 4px; }
  .qt-btn-text:hover { color: var(--blue); }

  /* ---------- impression / récap ---------- */
  .qt-print-box { border-top: 1.5px solid var(--blue-soft); padding-top: 32px; margin-top: 30px; text-align: center; }
  .qt-print-title { font-weight: 800; font-size: 16px; color: var(--ink); margin-bottom: 6px; }
  .qt-print-text { font-size: 13.5px; color: var(--muted); max-width: 400px; margin: 0 auto 18px; }
  .qt-actions-stack { display: flex; flex-direction: column; align-items: center; gap: 12px; }

  @media (max-width: 520px) {
    .qt-shell { padding: 40px 18px 56px; }
    .qt-card { padding: 16px 16px 18px; }
    .qt-btn { white-space: normal; text-align: center; padding: 0.85rem 1.6rem; }
  }

  @media print {
    .qt-print-box, .qt-nav, .qt-accordion-chevron { display: none !important; }
    body.qt-printing-bilan .qt-accordion-list { display: none !important; }
  }
</style>
</head>
<body>
<div class="qt-wrap">
  <div class="qt-shell">
    <div id="qt-app"></div>
  </div>
</div>

<script>
(function () {

  var PAGES = [
    {
      id: 'echelle',
      title: 'Mon échelle de <em>plaisir</em>',
      intro: "Une fois le guide audio suivi, complète le tableau ci-dessous.",
      rowHeader: 'Niveau',
      rows: [
        { id: 'niveau1', label: 'Niveau 1', fields: [
          { id: 'nom', label: 'Nom que tu lui donnes', type: 'textarea', placeholder: '(ex : je me chauffe)' },
          { id: 'desc', label: 'À quoi ça ressemble pour toi (sensations / pensées)', type: 'textarea', placeholder: "(ex : j'ai un peu envie mais je peux arrêter à tout moment. Mon corps est plutôt détendu, mon pénis réagit à peine, je suis plus dans la curiosité que dans le besoin.)" }
        ]},
        { id: 'niveau2', label: 'Niveau 2', fields: [
          { id: 'nom', label: 'Nom que tu lui donnes', type: 'textarea' },
          { id: 'desc', label: 'À quoi ça ressemble pour toi (sensations / pensées)', type: 'textarea' }
        ]},
        { id: 'niveau3', label: 'Niveau 3', fields: [
          { id: 'nom', label: 'Nom que tu lui donnes', type: 'textarea' },
          { id: 'desc', label: 'À quoi ça ressemble pour toi (sensations / pensées)', type: 'textarea' }
        ]},
        { id: 'niveau4', label: 'Niveau 4', fields: [
          { id: 'nom', label: 'Nom que tu lui donnes', type: 'textarea' },
          { id: 'desc', label: 'À quoi ça ressemble pour toi (sensations / pensées)', type: 'textarea' }
        ]},
        { id: 'niveau5', label: 'Niveau 5', fields: [
          { id: 'nom', label: 'Nom que tu lui donnes', type: 'textarea', placeholder: '(ex : au bord de venir)' },
          { id: 'desc', label: 'À quoi ça ressemble pour toi (sensations / pensées)', type: 'textarea', placeholder: "(ex : je sens que l'éjaculation peut se lancer à tout moment. Les sensations sont très intenses, j'ai l'impression que mon corps veut « lâcher ». Si je continue ne serait-ce qu'un peu, je sais que je vais éjaculer.)" }
        ]}
      ]
    },
    {
      id: 'zones',
      title: 'Zones du corps <em>(hors pénis)</em>',
      intro: "Pendant l'exo, tu explores cuisses, pubis, périnée, testicules, tétons, buste. Note ce qui se passe, sans chercher à analyser.",
      rowHeader: 'Zone',
      rows: [
        { id: 'cuisses', label: 'Intérieur des cuisses', fields: fieldsZone() },
        { id: 'pubis', label: 'Pubis', fields: fieldsZone() },
        { id: 'perinee', label: 'Périnée', fields: fieldsZone() },
        { id: 'testicules', label: 'Testicules', fields: fieldsZone() },
        { id: 'tetons', label: 'Tétons / buste', fields: fieldsZone() },
        { id: 'autre', label: 'Autre zone (à préciser)', fields: fieldsZone() }
      ]
    },
    {
      id: 'base',
      title: 'Base de la <em>verge</em>',
      intro: "Tu explores plusieurs façons de toucher la base de ta verge. Note ce qui change pour toi.",
      rowHeader: 'Stimulation',
      rows: [
        { id: 'caresse', label: 'Caresse du bout des doigts (tout autour)', fields: fieldsVerge(['facile', 'moyen', 'difficile'], 'Plus / moins gérable pour toi ?') },
        { id: 'massage', label: 'Massage avec pouce dessus + doigts dessous', fields: fieldsVerge(['facile', 'moyen', 'difficile'], 'Plus / moins gérable pour toi ?') },
        { id: 'poigne', label: 'Poigne plus ferme, vitesses et pressions variées', fields: fieldsVerge(['facile', 'moyen', 'difficile'], 'Plus / moins gérable pour toi ?') }
      ]
    },
    {
      id: 'hautverge',
      title: 'Partie haute de la verge <em>(sous le gland)</em>',
      rowHeader: 'Stimulation',
      rows: [
        { id: 'caresse', label: 'Caresse', fields: fieldsVerge(['plutôt douce', 'plutôt intense'], 'Tu la classes comment ?') },
        { id: 'massage', label: 'Massage', fields: fieldsVerge(['plutôt douce', 'plutôt intense'], 'Tu la classes comment ?') },
        { id: 'poigne', label: 'Poigne', fields: fieldsVerge(['plutôt douce', 'plutôt intense'], 'Tu la classes comment ?') }
      ]
    },
    {
      id: 'gland',
      title: '<em>Gland</em>',
      rowHeader: 'Stimulation',
      rows: [
        { id: 'base_frein', label: 'Base du gland + frein (va-et-vient modéré)', fields: fieldsGland() },
        { id: 'chapeau', label: 'Caresse du chapeau avec le pouce', fields: fieldsGland() },
        { id: 'dessous', label: "Caresse du dessous avec l'index", fields: fieldsGland() },
        { id: 'entier', label: 'Gland entier avec paume / doigts (dessus)', fields: fieldsGland() }
      ],
      afterQuestion: { id: 'redescendre', label: "Quand ça monte trop, qu'est-ce qui t'a aidé à redescendre un peu (changer de zone, changer de rythme, revenir à une stimulation plus gérable, pause…) ?", type: 'textarea' }
    },
    {
      id: 'bilan',
      isBilan: true,
      title: "Bilan : ce que j'ai compris sur mes <em>niveaux de plaisir</em>",
      questions: [
        { id: 'excite_vite', label: "Les zones qui m'excitent très vite :" },
        { id: 'gerable_longtemps', label: "Les zones et les façons de toucher qui me donnent du plaisir mais restent gérables longtemps :" },
        { id: 'descendre_pression', label: "Ce que je peux utiliser en rapport pour faire descendre la pression si ça va trop vite :" }
      ]
    }
  ];

  function fieldsZone() {
    return [
      { id: 'sensations', label: 'Sensations ressenties', type: 'textarea' },
      { id: 'effet', label: 'Effet sur excitation', type: 'pick', options: ['↓ baisse', '= pareil', '↑ monte'] },
      { id: 'niveau', label: 'Niveau (1–5)', type: 'input' }
    ];
  }
  function fieldsVerge(pickOptions, pickLabel) {
    return [
      { id: 'sensations', label: 'Sensations (texture, intensité…)', type: 'textarea' },
      { id: 'effet', label: 'Effet sur excitation', type: 'pick', options: ['↓ baisse', '= pareil', '↑ monte'] },
      { id: 'niveau', label: 'Niveau (1–5)', type: 'input' },
      { id: 'classe', label: pickLabel, type: 'pick', options: pickOptions }
    ];
  }
  function fieldsGland() {
    return [
      { id: 'sensations', label: 'Sensations (plaisir / inconfort / « trop »)', type: 'textarea' },
      { id: 'effet', label: 'Effet sur excitation', type: 'pick', options: ['↓ baisse', '= pareil', '↑ monte'] },
      { id: 'niveau', label: 'Niveau (1–5)', type: 'input' },
      { id: 'classe', label: 'Gérable ou trop intense ?', type: 'pick', options: ['gérable', 'trop intense', 'ça dépend'] }
    ];
  }

  var state = { answers: {} };

  function keyFor(pageId, rowId, fieldId) {
    return pageId + '.' + (rowId ? rowId + '.' : '') + fieldId;
  }

  function autosizeTextarea(ta) {
    ta.style.height = 'auto';
    ta.style.height = ta.scrollHeight + 'px';
  }

  function autosizeTextareasIn(container) {
    container.querySelectorAll('.qt-textarea').forEach(function (ta) {
      if (ta.value) { autosizeTextarea(ta); return; }
      if (ta.placeholder) {
        var original = ta.value;
        ta.value = ta.placeholder;
        autosizeTextarea(ta);
        ta.value = original;
      }
    });
  }

  function makeControl(pageId, rowId, field) {
    var key = keyFor(pageId, rowId, field.id);

    if (field.type === 'input') {
      var input = document.createElement('input');
      input.type = 'text';
      input.className = 'qt-input';
      if (field.placeholder) input.placeholder = field.placeholder;
      input.value = state.answers[key] || '';
      input.oninput = function () { state.answers[key] = input.value; };
      return input;
    } else if (field.type === 'textarea') {
      var ta = document.createElement('textarea');
      ta.className = 'qt-textarea';
      if (field.placeholder) ta.placeholder = field.placeholder;
      ta.value = state.answers[key] || '';
      ta.oninput = function () { state.answers[key] = ta.value; autosizeTextarea(ta); };
      return ta;
    } else if (field.type === 'pick') {
      var group = document.createElement('div');
      group.className = 'qt-pick-group';
      field.options.forEach(function (opt) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'qt-pick' + (state.answers[key] === opt ? ' qt-pick-active' : '');
        b.textContent = opt;
        b.onclick = function () {
          var isActive = b.classList.contains('qt-pick-active');
          group.querySelectorAll('.qt-pick').forEach(function (c) { c.classList.remove('qt-pick-active'); });
          if (!isActive) {
            b.classList.add('qt-pick-active');
            state.answers[key] = opt;
          } else {
            delete state.answers[key];
          }
        };
        group.appendChild(b);
      });
      return group;
    }
  }

  function makeField(pageId, rowId, field) {
    var wrap = document.createElement('div');
    wrap.className = 'qt-field';
    var lbl = document.createElement('label');
    lbl.className = 'qt-field-label';
    lbl.textContent = field.label;
    wrap.appendChild(lbl);
    wrap.appendChild(makeControl(pageId, rowId, field));
    return wrap;
  }

  function colWeight(kind) {
    if (kind === 'label') return 1.15;
    if (kind === 'textarea') return 1.9;
    if (kind === 'pick') return 1.3;
    return 0.8; // input
  }

  function makeTable(page) {
    var tableWrap = document.createElement('div');
    tableWrap.className = 'qt-table-wrap';
    var table = document.createElement('table');
    table.className = 'qt-table';

    var weights = [colWeight('label')].concat(page.rows[0].fields.map(function (f) { return colWeight(f.type); }));
    var totalWeight = weights.reduce(function (a, b) { return a + b; }, 0);
    var colgroup = document.createElement('colgroup');
    weights.forEach(function (w) {
      var col = document.createElement('col');
      col.style.width = ((w / totalWeight) * 100).toFixed(2) + '%';
      colgroup.appendChild(col);
    });
    table.appendChild(colgroup);

    var thead = document.createElement('thead');
    var headRow = document.createElement('tr');
    var th0 = document.createElement('th');
    th0.textContent = page.rowHeader || '';
    headRow.appendChild(th0);
    page.rows[0].fields.forEach(function (f) {
      var th = document.createElement('th');
      th.textContent = f.label;
      headRow.appendChild(th);
    });
    thead.appendChild(headRow);
    table.appendChild(thead);

    var tbody = document.createElement('tbody');
    page.rows.forEach(function (row) {
      var tr = document.createElement('tr');
      var tdLabel = document.createElement('td');
      tdLabel.className = 'qt-table-rowlabel';
      tdLabel.textContent = row.label;
      tr.appendChild(tdLabel);
      row.fields.forEach(function (f) {
        var td = document.createElement('td');
        td.appendChild(makeControl(page.id, row.id, f));
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    tableWrap.appendChild(table);
    return tableWrap;
  }

  function buildPage() {
    var app = document.getElementById('qt-app');
    app.innerHTML = '';
    var wrap = document.createElement('div');
    wrap.className = 'qt-screen';

    var content = document.createElement('div');
    content.id = 'qt-page-content';

    var header = document.createElement('div');
    header.innerHTML = '<span class="qt-eyebrow">Semaine 2 — Redéfinir</span>'
      + '<h1>Mes niveaux de <em>plaisir</em></h1>'
      + '<p class="qt-intro-text">Échelle d\'excitation, repérer les paliers.</p>'
      + '<p class="qt-tip">C\'est plus confortable à remplir sur ordinateur, les tableaux sont assez larges. Si tu es sur téléphone, pense à le passer en mode paysage.</p>';
    while (header.firstChild) { content.appendChild(header.firstChild); }

    var tablePages = PAGES.filter(function (p) { return !p.isBilan; });
    var accordionList = document.createElement('div');
    accordionList.className = 'qt-accordion-list';
    tablePages.forEach(function (page, i) {
      var acc = document.createElement('div');
      acc.className = 'qt-accordion';

      var headerBtn = document.createElement('button');
      headerBtn.type = 'button';
      headerBtn.className = 'qt-accordion-header';
      var plainTitle = page.title.replace(/<[^>]+>/g, '');
      headerBtn.innerHTML = '<span><span class="qt-jump-num">' + (i + 1) + '.</span>' + plainTitle + '</span>'
        + '<span class="qt-accordion-chevron" aria-hidden="true">⌄</span>';

      var panel = document.createElement('div');
      panel.className = 'qt-accordion-panel';
      if (page.intro) {
        var introP = document.createElement('p');
        introP.className = 'qt-intro-text';
        introP.textContent = page.intro;
        panel.appendChild(introP);
      }
      panel.appendChild(makeTable(page));
      if (page.afterQuestion) {
        var hr = document.createElement('hr');
        hr.className = 'qt-divider';
        panel.appendChild(hr);
        panel.appendChild(makeField(page.id, null, page.afterQuestion));
      }

      headerBtn.onclick = function () {
        var willOpen = !acc.classList.contains('qt-accordion-open');
        acc.classList.toggle('qt-accordion-open');
        if (willOpen) { autosizeTextareasIn(panel); }
      };
      acc.appendChild(headerBtn);
      acc.appendChild(panel);
      accordionList.appendChild(acc);
    });
    content.appendChild(accordionList);

    var bilanPage = PAGES.filter(function (p) { return p.isBilan; })[0];
    var bilanSection = document.createElement('div');
    bilanSection.style.marginTop = '36px';
    var bHeader = document.createElement('div');
    bHeader.innerHTML = '<h1>' + bilanPage.title + '</h1>';
    while (bHeader.firstChild) { bilanSection.appendChild(bHeader.firstChild); }
    bilanPage.questions.forEach(function (q) {
      bilanSection.appendChild(makeField(bilanPage.id, null, { id: q.id, label: q.label, type: 'textarea' }));
    });
    content.appendChild(bilanSection);

    wrap.appendChild(content);

    var printBox = document.createElement('div');
    printBox.className = 'qt-print-box';
    printBox.innerHTML = '<div class="qt-print-title">Garde tes réponses</div>'
      + '<p class="qt-print-text">Imprime ton bilan, ou l\'ensemble de tes tableaux remplis, et garde-les en PDF pour les relire quand tu veux.</p>'
      + '<div class="qt-actions-stack">'
      + '<button type="button" class="qt-btn" id="qt-print-btn"><span>Imprimer mon bilan / PDF</span><span class="qt-arrow" aria-hidden="true">→</span></button>'
      + '<button type="button" class="qt-btn qt-btn-outline" id="qt-print-all-btn"><span>Imprimer toutes mes réponses / PDF</span><span class="qt-arrow" aria-hidden="true">→</span></button>'
      + '<button type="button" class="qt-btn qt-btn-outline" id="qt-restart"><span>Recommencer</span><span class="qt-arrow" aria-hidden="true">↺</span></button>'
      + '</div>';
    wrap.appendChild(printBox);
    app.appendChild(wrap);

    printBox.querySelector('#qt-print-btn').onclick = function () {
      document.body.classList.add('qt-printing-bilan');
      window.print();
    };
    printBox.querySelector('#qt-print-all-btn').onclick = function () {
      document.body.classList.remove('qt-printing-bilan');
      document.querySelectorAll('.qt-accordion').forEach(function (a) {
        if (!a.classList.contains('qt-accordion-open')) {
          a.classList.add('qt-accordion-open');
          autosizeTextareasIn(a.querySelector('.qt-accordion-panel'));
        }
      });
      window.print();
    };
    printBox.querySelector('#qt-restart').onclick = function () { state = { answers: {} }; buildPage(); };
  }

  buildPage();

  /* ---------- auto-hauteur pour intégration en iframe (Kajabi) ---------- */
  (function () {
    var lastHeight = 0;
    function reportHeight() {
      var h = document.documentElement.scrollHeight;
      if (h !== lastHeight) {
        lastHeight = h;
        window.parent.postMessage({ type: 'come-quiz-height', height: h }, '*');
      }
    }
    var observer = new MutationObserver(reportHeight);
    observer.observe(document.body, { childList: true, subtree: true, attributes: true });
    window.addEventListener('load', reportHeight);
    window.addEventListener('resize', reportHeight);
    setTimeout(reportHeight, 300);
  })();

  window.addEventListener('afterprint', function () {
    document.body.classList.remove('qt-printing-bilan');
  });
})();
</script>
</body>
</html>
